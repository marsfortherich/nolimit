/* ============================================================================
   ARCADE — the shared design system.

   One stylesheet, dropped into every game. Everything here is namespaced with
   an `ac-` prefix (class names and custom properties alike) so it can never
   collide with a game's own CSS. Games keep their own palette and layout; this
   file supplies the shared *language*: one spacing scale, one radius scale,
   one elevation recipe, one set of controls, and the account/leaderboard
   chrome that makes the three games read as one platform.

   A game opts into its theme with `<html data-arcade-game="pegfall">`.
   ========================================================================= */

:root {
  /* ---- type ------------------------------------------------------------ */
  --ac-font-ui: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ac-font-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --ac-fs-micro: 9.5px;
  --ac-fs-tiny: 11px;
  --ac-fs-sm: 12.5px;
  --ac-fs-md: 14px;
  --ac-fs-lg: 18px;
  --ac-fs-xl: 24px;
  --ac-fs-display: 34px;

  --ac-track-caps: .16em;   /* the platform's uppercase label tracking */

  /* ---- space (4px base) ------------------------------------------------ */
  --ac-s1: 4px;
  --ac-s2: 8px;
  --ac-s3: 12px;
  --ac-s4: 16px;
  --ac-s5: 24px;
  --ac-s6: 32px;

  /* ---- shape ----------------------------------------------------------- */
  --ac-r-sm: 6px;
  --ac-r-md: 10px;
  --ac-r-lg: 16px;
  --ac-r-pill: 999px;

  /* ---- elevation -------------------------------------------------------
     The "cardboard lift": a hard bottom edge plus a soft cast shadow. Both
     casino games already drew their panels this way; adopting it everywhere
     is most of what makes the set feel like one toolbox. */
  --ac-lift-1: 0 2px 0 rgba(0, 0, 0, .45);
  --ac-lift-2: 0 4px 0 rgba(0, 0, 0, .45), 0 10px 22px rgba(0, 0, 0, .35);
  --ac-lift-3: 0 8px 0 rgba(0, 0, 0, .5), 0 22px 48px rgba(0, 0, 0, .45);

  /* ---- neutral surfaces (per-game themes tint these) ------------------- */
  --ac-surface-0: #0d1117;
  --ac-surface-1: #161c25;
  --ac-surface-2: #1f2731;
  --ac-surface-3: #2b3541;
  --ac-line: #3a4552;
  --ac-ink: #eef2f7;
  --ac-ink-dim: #9aa6b3;

  /* ---- semantic -------------------------------------------------------- */
  --ac-accent: #4b8bd6;         /* the game's primary action colour */
  --ac-accent-deep: #2c5a92;    /* its hard bottom edge */
  --ac-accent-ink: #ffffff;     /* text on top of it */
  --ac-gold: #d9b45b;
  --ac-gold-deep: #9a7c2d;
  --ac-good: #3fa96b;
  --ac-bad: #d1524a;

  /* ---- motion ---------------------------------------------------------- */
  --ac-fast: 120ms ease;
  --ac-slow: 240ms cubic-bezier(.2, .8, .3, 1);

  /* ---- the arcade bar's footprint --------------------------------------
     Measured and republished by arcade-ui.js whenever the bar changes size.
     Games reserve room for the bar with
         padding-right: calc(var(--ac-bar-w) + var(--ac-s4));
     so the clearance tracks the signed-in player's name length instead of a
     number that goes stale. These are the pre-measurement fallbacks. */
  --ac-bar-w: 300px;
  --ac-bar-h: 42px;

  /* ---- stacking -------------------------------------------------------- */
  --ac-z-bar: 400;
  --ac-z-modal: 900;
  --ac-z-toast: 960;
}

/* ============================================================================
   Per-game themes. Same structure everywhere — only the hue moves.
   ========================================================================= */

html[data-arcade-game="pegfall"] {
  --ac-surface-0: #070b11;
  --ac-surface-1: #121822;
  --ac-surface-2: #172030;
  --ac-surface-3: #222d3f;
  --ac-line: #2b3749;
  --ac-ink: #e8eef7;
  --ac-ink-dim: #8496ac;
  --ac-accent: #79c0ff;
  --ac-accent-deep: #2f6ea8;
  --ac-accent-ink: #071019;
  --ac-gold: #f2cc60;
  --ac-gold-deep: #a8842d;
  --ac-font-ui: var(--ac-font-num);
}

html[data-arcade-game="onemoreroll"] {
  --ac-surface-0: #150f0a;
  --ac-surface-1: #241a13;
  --ac-surface-2: #30231a;
  --ac-surface-3: #423125;
  --ac-line: #4a3527;
  --ac-ink: #f5ece0;
  --ac-ink-dim: #a89680;
  --ac-accent: #2f9e8f;
  --ac-accent-deep: #1b6a5f;
  --ac-accent-ink: #ffffff;
  --ac-gold: #d9a63c;
  --ac-gold-deep: #96681a;
  --ac-bad: #d4564b;
  --ac-font-ui: "Segoe UI", system-ui, -apple-system, "Trebuchet MS", sans-serif;
}

html[data-arcade-game="nolimit"] {
  --ac-surface-0: #0a0d11;
  --ac-surface-1: #171b21;
  --ac-surface-2: #1f242c;
  --ac-surface-3: #2a3039;
  --ac-line: #39404b;
  --ac-ink: #eae5d8;
  --ac-ink-dim: #99a1ad;
  --ac-accent: #c0392b;
  --ac-accent-deep: #8a2318;
  --ac-accent-ink: #fff4f0;
  --ac-gold: #d9b45b;
  --ac-gold-deep: #a8842d;
}

html[data-arcade-game="hub"] {
  --ac-surface-0: #090d13;
  --ac-surface-1: #141b24;
  --ac-surface-2: #1d2531;
  --ac-surface-3: #28323f;
  --ac-line: #38434f;
  --ac-accent: #d9b45b;
  --ac-accent-deep: #9a7c2d;
  --ac-accent-ink: #221a06;
}

/* ============================================================================
   Primitives
   ========================================================================= */

.ac-root, .ac-root * { box-sizing: border-box; }

/* Host games set their own body-level typography and, in one case, disable
   text selection outright. The shared chrome states its own so it looks and
   behaves identically in all three. */
.ac-root input,
.ac-root textarea { user-select: text; -webkit-user-select: text; }

.ac-cap {
  font-size: var(--ac-fs-micro);
  letter-spacing: var(--ac-track-caps);
  text-transform: uppercase;
  color: var(--ac-ink-dim);
}

.ac-num { font-family: var(--ac-font-num); font-variant-numeric: tabular-nums; }

.ac-hidden { display: none !important; }

/* ---- buttons -------------------------------------------------------------
   One button, four intents, three sizes. Every game's shared chrome uses
   these; each game's own in-game buttons are left exactly as they were. */
.ac-btn {
  font-family: var(--ac-font-ui);
  font-weight: 700;
  font-size: var(--ac-fs-sm);
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ac-ink);
  background: linear-gradient(180deg, var(--ac-surface-3), var(--ac-surface-2));
  border: 1px solid var(--ac-line);
  border-radius: var(--ac-r-md);
  padding: 9px 16px;
  cursor: pointer;
  box-shadow: var(--ac-lift-1);
  transition: filter var(--ac-fast), transform var(--ac-fast), box-shadow var(--ac-fast);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--ac-s2);
  line-height: 1.1;
}
.ac-btn:hover:not(:disabled) { filter: brightness(1.18); }
.ac-btn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.ac-btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
.ac-btn:focus-visible { outline: 2px solid var(--ac-gold); outline-offset: 2px; }

.ac-btn--primary {
  background: linear-gradient(180deg, var(--ac-accent), var(--ac-accent-deep));
  border-color: var(--ac-accent);
  color: var(--ac-accent-ink);
}
.ac-btn--gold {
  background: linear-gradient(180deg, var(--ac-gold), var(--ac-gold-deep));
  border-color: var(--ac-gold);
  color: #241a04;
}
.ac-btn--danger {
  background: linear-gradient(180deg, var(--ac-bad), #8c2f29);
  border-color: var(--ac-bad);
  color: #fff;
}
.ac-btn--ghost { background: transparent; box-shadow: none; }
.ac-btn--sm { padding: 6px 11px; font-size: var(--ac-fs-tiny); }
.ac-btn--lg { padding: 13px 26px; font-size: var(--ac-fs-md); }
.ac-btn--block { width: 100%; }
/* The "back to the arcade" link: a button that is actually an anchor. */
.ac-btn--home { text-decoration: none; color: var(--ac-gold); }
.ac-btn--home .ac-bar__diamond { width: 7px; height: 7px; }

/* ---- surfaces ---------------------------------------------------------- */
.ac-panel {
  background: linear-gradient(180deg, var(--ac-surface-2), var(--ac-surface-1));
  border: 1px solid var(--ac-line);
  border-radius: var(--ac-r-md);
  box-shadow: var(--ac-lift-2);
  padding: var(--ac-s4);
}

.ac-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--ac-s1);
  background: var(--ac-surface-3);
  border: 1px solid var(--ac-line);
  border-radius: var(--ac-r-pill);
  padding: 3px 10px;
  font-size: var(--ac-fs-tiny);
  color: var(--ac-ink-dim);
}

/* ---- fields ------------------------------------------------------------ */
.ac-field { display: flex; flex-direction: column; gap: var(--ac-s1); margin-bottom: var(--ac-s3); }
.ac-field > label {
  font-size: var(--ac-fs-micro);
  letter-spacing: var(--ac-track-caps);
  text-transform: uppercase;
  color: var(--ac-ink-dim);
}
.ac-input {
  font-family: var(--ac-font-ui);
  font-size: var(--ac-fs-md);
  color: var(--ac-ink);
  background: var(--ac-surface-0);
  border: 1px solid var(--ac-line);
  border-radius: var(--ac-r-sm);
  padding: 10px 12px;
  width: 100%;
  font-weight: 400;
  text-transform: none;
  letter-spacing: normal;
  transition: border-color var(--ac-fast);
}
.ac-input:focus { outline: none; border-color: var(--ac-accent); }
.ac-input::placeholder { color: rgba(154, 166, 179, .6); }

.ac-note { font-size: var(--ac-fs-tiny); color: var(--ac-ink-dim); line-height: 1.55; }
.ac-error {
  font-size: var(--ac-fs-sm);
  color: #ffd7d3;
  background: rgba(209, 82, 74, .16);
  border: 1px solid var(--ac-bad);
  border-radius: var(--ac-r-sm);
  padding: 8px 11px;
  margin-bottom: var(--ac-s3);
  line-height: 1.5;
}
.ac-ok {
  font-size: var(--ac-fs-sm);
  color: #d3ffe4;
  background: rgba(63, 169, 107, .16);
  border: 1px solid var(--ac-good);
  border-radius: var(--ac-r-sm);
  padding: 8px 11px;
  margin-bottom: var(--ac-s3);
}

/* ============================================================================
   The arcade bar — the single most recognisable shared element.
   Fixed to the top-right of every game.
   ========================================================================= */

.ac-bar {
  position: fixed;
  top: 10px;
  right: 12px;
  z-index: var(--ac-z-bar);
  display: flex;
  align-items: center;
  gap: var(--ac-s1);
  padding: 5px 6px;
  background: rgba(20, 27, 36, .86);
  border: 1px solid var(--ac-line);
  border-radius: var(--ac-r-pill);
  box-shadow: var(--ac-lift-2);
  backdrop-filter: blur(8px);
  font-family: var(--ac-font-ui);
  color: var(--ac-ink);
  user-select: none;
}

/* Brand group: the wordmark links home, the caret opens the switcher. */
.ac-bar__brand {
  display: flex;
  align-items: center;
  border-right: 1px solid var(--ac-line);
  padding-right: 4px;
  margin-right: var(--ac-s1);
}

.ac-bar__mark {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-radius: var(--ac-r-pill);
  font-size: var(--ac-fs-micro);
  letter-spacing: var(--ac-track-caps);
  text-transform: uppercase;
  color: var(--ac-gold);
  border: 0;
  cursor: pointer;
  background: none;
  text-decoration: none;
  font-family: inherit;
  font-weight: 700;
  transition: background var(--ac-fast), filter var(--ac-fast);
}
.ac-bar__mark:hover { filter: brightness(1.25); background: var(--ac-surface-2); }
.ac-bar__mark:focus-visible { outline: 2px solid var(--ac-gold); outline-offset: 1px; }

/* On the hub itself there is nowhere to go, so the mark is a label. */
.ac-bar__mark.is-here { cursor: default; }
.ac-bar__mark.is-here:hover { filter: none; background: none; }

.ac-bar__caret {
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  padding: 0;
  font-size: 10px;
  line-height: 1;
  color: var(--ac-ink-dim);
  background: none;
  border: 0;
  border-radius: var(--ac-r-pill);
  cursor: pointer;
  font-family: inherit;
  transition: background var(--ac-fast), color var(--ac-fast);
}
.ac-bar__caret:hover { background: var(--ac-surface-2); color: var(--ac-ink); }
.ac-bar__caret:focus-visible { outline: 2px solid var(--ac-gold); outline-offset: 1px; }
.ac-bar__diamond {
  width: 9px; height: 9px;
  background: var(--ac-gold);
  transform: rotate(45deg);
  border-radius: 1px;
}

.ac-bar__btn {
  font-family: var(--ac-font-ui);
  font-weight: 700;
  font-size: var(--ac-fs-tiny);
  letter-spacing: .06em;
  color: var(--ac-ink);
  background: var(--ac-surface-2);
  border: 1px solid transparent;
  border-radius: var(--ac-r-pill);
  padding: 6px 13px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  text-transform: uppercase;
  letter-spacing: .08em;
  transition: background var(--ac-fast), border-color var(--ac-fast);
}
.ac-bar__btn:hover { background: var(--ac-surface-3); border-color: var(--ac-line); }
.ac-bar__btn--signed { padding-left: 5px; }

.ac-avatar {
  width: 20px; height: 20px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 10px;
  font-weight: 800;
  color: var(--ac-accent-ink);
  background: linear-gradient(180deg, var(--ac-accent), var(--ac-accent-deep));
  flex: none;
}
.ac-avatar--lg { width: 40px; height: 40px; font-size: 17px; }

.ac-bar__state {
  font-size: var(--ac-fs-micro);
  color: var(--ac-ink-dim);
  padding: 0 8px;
  letter-spacing: .1em;
  text-transform: uppercase;
}

/* game switcher popover */
.ac-switch {
  position: fixed;
  top: 52px;
  right: 12px;
  z-index: var(--ac-z-bar);
  width: 250px;
  padding: var(--ac-s2);
  background: var(--ac-surface-1);
  border: 1px solid var(--ac-line);
  border-radius: var(--ac-r-md);
  box-shadow: var(--ac-lift-3);
  font-family: var(--ac-font-ui);
}
.ac-switch__title { padding: 4px 8px 8px; }
.ac-switch a {
  display: flex;
  align-items: center;
  gap: var(--ac-s2);
  padding: 8px;
  border-radius: var(--ac-r-sm);
  color: var(--ac-ink);
  text-decoration: none;
  font-size: var(--ac-fs-sm);
  font-weight: 700;
}
.ac-switch a:hover { background: var(--ac-surface-2); }
.ac-switch a[aria-current="true"] { background: var(--ac-surface-3); cursor: default; }
.ac-switch__glyph {
  width: 26px; height: 26px;
  border-radius: var(--ac-r-sm);
  display: grid; place-items: center;
  font-size: 14px;
  background: var(--ac-surface-3);
  border: 1px solid var(--ac-line);
  flex: none;
}
.ac-switch__sub {
  display: block;
  font-size: var(--ac-fs-micro);
  font-weight: 400;
  color: var(--ac-ink-dim);
  letter-spacing: .06em;
  text-transform: uppercase;
}

/* ============================================================================
   Modal
   ========================================================================= */

.ac-modal {
  position: fixed;
  inset: 0;
  z-index: var(--ac-z-modal);
  background: rgba(4, 7, 11, .78);
  backdrop-filter: blur(5px);
  display: grid;
  place-items: center;
  padding: var(--ac-s4);
  overflow-y: auto;
  font-family: var(--ac-font-ui);
  color: var(--ac-ink);
}
.ac-modal__box {
  width: 100%;
  max-width: 460px;
  max-height: 92vh;
  overflow-y: auto;
  background: linear-gradient(180deg, var(--ac-surface-2), var(--ac-surface-1));
  border: 1px solid var(--ac-line);
  border-radius: var(--ac-r-lg);
  box-shadow: var(--ac-lift-3);
  animation: ac-rise var(--ac-slow);
}
.ac-modal__box--wide { max-width: 580px; }
@keyframes ac-rise { from { transform: translateY(12px); opacity: 0; } }

.ac-modal__head {
  display: flex;
  align-items: center;
  gap: var(--ac-s3);
  padding: var(--ac-s4) var(--ac-s5);
  border-bottom: 1px solid var(--ac-line);
}
.ac-modal__title {
  margin: 0;
  font-size: var(--ac-fs-lg);
  letter-spacing: .1em;
  text-transform: uppercase;
  font-weight: 800;
  flex: 1;
}
.ac-modal__sub {
  margin: 2px 0 0;
  font-size: var(--ac-fs-tiny);
  color: var(--ac-ink-dim);
  letter-spacing: .04em;
  text-transform: none;
  font-weight: 400;
}
.ac-modal__x {
  background: none; border: none; cursor: pointer;
  color: var(--ac-ink-dim); font-size: 22px; line-height: 1;
  padding: 0 2px;
}
.ac-modal__x:hover { color: var(--ac-ink); }
.ac-modal__body { padding: var(--ac-s5); }
.ac-modal__foot {
  padding: var(--ac-s3) var(--ac-s5) var(--ac-s5);
  display: flex; gap: var(--ac-s2); justify-content: center; flex-wrap: wrap;
}

/* tabs */
.ac-tabs {
  display: flex;
  gap: var(--ac-s1);
  padding: var(--ac-s2);
  background: var(--ac-surface-0);
  border-radius: var(--ac-r-md);
  margin-bottom: var(--ac-s4);
}
.ac-tab {
  flex: 1;
  font-family: var(--ac-font-ui);
  font-weight: 700;
  font-size: var(--ac-fs-tiny);
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ac-ink-dim);
  background: none;
  border: none;
  border-radius: var(--ac-r-sm);
  padding: 8px;
  cursor: pointer;
}
.ac-tab[aria-selected="true"] { background: var(--ac-surface-2); color: var(--ac-ink); box-shadow: var(--ac-lift-1); }

/* ============================================================================
   Leaderboard
   ========================================================================= */

/* Category switch. Deliberately lighter than the game tabs above it: the game
   is the bigger choice, the metric a refinement within it. */
.ac-metrics {
  display: flex;
  gap: var(--ac-s1);
  flex-wrap: wrap;
  margin-bottom: var(--ac-s4);
}
.ac-metric {
  font-family: var(--ac-font-ui);
  font-weight: 700;
  font-size: var(--ac-fs-micro);
  letter-spacing: var(--ac-track-caps);
  text-transform: uppercase;
  color: var(--ac-ink-dim);
  background: transparent;
  border: 1px solid var(--ac-line);
  border-radius: var(--ac-r-pill);
  padding: 5px 12px;
  cursor: pointer;
  transition: color var(--ac-fast), background var(--ac-fast), border-color var(--ac-fast);
}
.ac-metric:hover { color: var(--ac-ink); background: var(--ac-surface-2); }
.ac-metric[aria-selected="true"] {
  color: var(--ac-accent-ink);
  background: linear-gradient(180deg, var(--ac-accent), var(--ac-accent-deep));
  border-color: var(--ac-accent);
}
.ac-metric:focus-visible { outline: 2px solid var(--ac-gold); outline-offset: 2px; }

.ac-lb { display: flex; flex-direction: column; gap: 3px; }
.ac-lb__head {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  gap: var(--ac-s3);
  padding: 0 var(--ac-s3) var(--ac-s2);
  font-size: var(--ac-fs-micro);
  letter-spacing: var(--ac-track-caps);
  text-transform: uppercase;
  color: var(--ac-ink-dim);
}
.ac-lb__row {
  display: grid;
  grid-template-columns: 34px 1fr auto;
  gap: var(--ac-s3);
  align-items: center;
  padding: 9px var(--ac-s3);
  background: var(--ac-surface-2);
  border: 1px solid transparent;
  border-radius: var(--ac-r-sm);
  font-size: var(--ac-fs-sm);
}
.ac-lb__row--you { border-color: var(--ac-gold); background: rgba(217, 180, 91, .13); }
.ac-lb__rank { font-family: var(--ac-font-num); font-weight: 800; color: var(--ac-ink-dim); text-align: right; }
.ac-lb__row--1 .ac-lb__rank { color: var(--ac-gold); }
.ac-lb__row--2 .ac-lb__rank { color: #cdd6e0; }
.ac-lb__row--3 .ac-lb__rank { color: #c08457; }
.ac-lb__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; }
.ac-lb__meta {
  display: block;
  font-size: var(--ac-fs-micro);
  color: var(--ac-ink-dim);
  font-weight: 400;
  letter-spacing: .04em;
}
.ac-lb__score {
  font-family: var(--ac-font-num);
  font-weight: 800;
  color: var(--ac-gold);
  font-variant-numeric: tabular-nums;
}
.ac-lb__gap { text-align: center; color: var(--ac-ink-dim); letter-spacing: .3em; padding: 2px 0; }
.ac-lb__empty {
  text-align: center;

  .wheel-wrap { flex-direction: row; flex-wrap: wrap; justify-content: center; align-items: center; gap: 14px; }
  .wheel-svg { max-width: 190px; }
  .steps { max-width: 340px; }
  .felt-grid { grid-template-columns: 26px repeat(12, 1fr) 34px; grid-template-rows: auto 32px 32px 32px 26px 26px; }
  .bet { font-size: 12px; }
}

.bet {
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.22);
  border-radius: 4px;
  display: grid;
  place-items: center;
  font-size: 15px;
  font-weight: bold;
  min-height: 22px;
  color: #fff;
  background: rgba(255,255,255,.05);
  transition: filter .1s, transform .08s;
  user-select: none;
}
.bet:hover:not(.locked) { filter: brightness(1.45); transform: translateY(-1px); }
.bet.red { background: var(--red); }
.bet.black { background: var(--black); }
.bet.green { background: var(--green); }
.bet.outside { background: rgba(255,255,255,.06); font-size: 12px; letter-spacing: .04em; }
.bet.locked { background: repeating-linear-gradient(45deg, #2a2a2a, #2a2a2a 5px, #1a1a1a 5px, #1a1a1a 10px); color: #666; cursor: not-allowed; }
.bet.hit { outline: 3px solid var(--gold); outline-offset: -1px; z-index: 3; animation: pop .4s ease; }
.bet.dimmed { opacity: .35; }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); } }

.bet .enh {
  position: absolute; top: 1px; right: 2px;
  font-size: 10px; color: var(--gold-hot);
  text-shadow: 0 0 5px rgba(0,0,0,.9);
}
.bet .dupe {
  position: absolute; bottom: 0px; right: 3px;
  font-size: 9px; color: #fff; opacity: .8;
}
.bet .gone { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.72); color: #7d8794; font-size: 16px; border-radius: 3px; }

/* Chips sit in the corner of the box so the label underneath stays readable. */
.chipstack {
  position: absolute;
  z-index: 2;
  right: 2px; bottom: 1px;
  width: 22px; height: 22px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff8e0, var(--gold) 60%, #8a6f26);
  border: 2px dashed rgba(0,0,0,.5);
  color: #2a1f05; font-size: 12px; font-weight: bold;
  display: grid; place-items: center;
  box-shadow: 0 2px 5px rgba(0,0,0,.55);
  pointer-events: none;
}

.zero { font-size: 19px; }
.colbet { font-size: 11px; }
.dozrow { display: grid; grid-template-columns: 34px repeat(12, 1fr) 46px; gap: 2px; margin-top: 3px; }
.dozrow .bet, .evenrow .bet { min-height: 24px; }
.evenrow { display: grid; grid-template-columns: 34px repeat(12, 1fr) 46px; gap: 2px; margin-top: 3px; }

/* ------------------------------------------------------------------ */
/*  Buttons                                                            */
/* ------------------------------------------------------------------ */

.btn {
  background: linear-gradient(180deg, var(--panel-3), #1b2027);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: .09em;
  text-transform: uppercase;
  box-shadow: 0 4px 0 rgba(0,0,0,.5);
  transition: transform .08s, box-shadow .08s, filter .1s;
}
.btn:hover:not(:disabled) { filter: brightness(1.22); }
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.5); }
.btn:disabled { opacity: .4; box-shadow: none; }
.btn.primary { background: linear-gradient(180deg, #d94f3d, #9c2c1f); border-color: #e8705f; }
.btn.gold { background: linear-gradient(180deg, #e0be6b, #a8842d); border-color: #f2dda2; color: #2a2007; }
.btn.green { background: linear-gradient(180deg, #2fb47a, #17714a); border-color: #57d6a0; }
.btn.purple { background: linear-gradient(180deg, #9b5fd0, #5f3387); border-color: #c491ef; }
.btn.big { padding: 14px 34px; font-size: 17px; }
.btn.sm { padding: 6px 12px; font-size: 11px; }

/* ------------------------------------------------------------------ */
/*  Panels / screens                                                   */
/* ------------------------------------------------------------------ */

.panel {
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 18px;
}

.screen-title { text-align: center; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); font-size: 13px; margin: 0 0 14px; }

.blind-choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 900px; margin: 0 auto; }
.blind-tile {
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
  text-align: center;
  display: flex; flex-direction: column; gap: 8px; align-items: center;
  transition: opacity .2s;
}
.blind-tile.done { opacity: .35; }
.blind-tile.current { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 30px rgba(217,180,91,.16); }
.blind-tile.bossTile { border-color: var(--red); }
.blind-tile h3 { margin: 0; font-size: 16px; letter-spacing: .06em; }
.blind-tile .glyph { font-size: 40px; }
.blind-tile .req { font-size: 13px; color: var(--ink-dim); }
.blind-tile .req b { color: var(--red-hot); font-size: 20px; display: block; }
.blind-tile .rew { font-size: 12px; color: var(--gold); }
.blind-tile .bosstext { font-size: 12px; color: var(--red-hot); min-height: 32px; }

.shop-grid { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
.shop-card { width: 156px; }
.shop-card .cname { font-size: 13px; }
.shop-card .ctext { font-size: 11px; color: var(--ink-dim); line-height: 1.35; min-height: 46px; }

.centered { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; height: 100%; text-align: center; }
.bigtitle { font-size: 46px; letter-spacing: .2em; color: var(--gold); text-transform: uppercase; margin: 0; text-shadow: 0 4px 0 rgba(0,0,0,.5); }
.subtitle { color: var(--ink-dim); letter-spacing: .28em; text-transform: uppercase; font-size: 12px; }

.cashline { display: flex; justify-content: space-between; gap: 30px; padding: 6px 12px; background: rgba(255,255,255,.04); border-radius: 6px; min-width: 320px; }
.cashline b { color: var(--gold); }

/* ------------------------------------------------------------------ */
/*  Tooltip + modal                                                    */
/* ------------------------------------------------------------------ */

#tooltip {
  position: fixed;
  z-index: 100;
  max-width: 250px;
  background: #0d1015;
  border: 1px solid var(--gold);
  border-radius: 8px;
  padding: 9px 11px;
  font-size: 12px;
  line-height: 1.45;
  box-shadow: 0 8px 24px rgba(0,0,0,.7);
  pointer-events: none;
}
#tooltip h4 { margin: 0 0 4px; font-size: 13px; color: var(--gold-hot); }
#tooltip .rare { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }

#modal {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(0,0,0,.72);
  display: grid; place-items: center;
  padding: 24px;
}
.modal-box { max-width: 760px; width: 100%; max-height: 86vh; overflow-y: auto; }
.pocket-picker { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 12px; }
.pocket-pick {
  width: 44px; height: 44px; border-radius: 5px; border: 1px solid rgba(255,255,255,.25);
  display: grid; place-items: center; font-weight: bold; position: relative; font-size: 14px;
}
.pocket-pick:hover { outline: 2px solid var(--gold); }
.pocket-pick.red { background: var(--red); }
.pocket-pick.black { background: var(--black); }
.pocket-pick.green { background: var(--green); }
.pocket-pick .enh { position: absolute; top: 0; right: 2px; font-size: 10px; color: var(--gold-hot); }

.candidates { display: flex; gap: 24px; justify-content: center; margin-top: 14px; }
.candidate { display: flex; flex-direction: column; align-items: center; gap: 8px; }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-track { background: rgba(0,0,0,.25); }
::-webkit-scrollbar-thumb { background: #3c4450; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #4e5866; }

.strip .bet { min-height: 15px; font-size: 8px; letter-spacing: 0; padding: 0; }
.strip .chipstack { width: 13px; height: 13px; font-size: 8px; border-width: 1px; right: 1px; bottom: 1px; }
.felt-grid > .strip { row-gap: 2px; }

/* Our #id rules set `display`, which outranks the UA agent's [hidden] rule. */
[hidden] { display: none !important; }

/* ================================================================== */
/*  Effects layer                                                      */
/* ================================================================== */

#fx {
  position: fixed;
  inset: 0;
  z-index: 80;
  pointer-events: none;
  overflow: hidden;
}

.fx-float {
  position: absolute;
  transform: translate(-50%, 0);
  font-weight: bold;
  font-size: 15px;
  white-space: nowrap;
  text-shadow: 0 2px 0 rgba(0,0,0,.8), 0 0 10px rgba(0,0,0,.6);
  will-change: transform, opacity;
}
.fx-chips { color: #9fd0ff; }
.fx-mult, .fx-xmult { color: #ff9d8f; }
.fx-xmult { font-size: 19px; color: #ffb26b; }
.fx-bet { color: var(--ink); }
.fx-money { color: var(--gold-hot); }
.fx-dead, .fx-warn { color: #7d8794; font-size: 13px; }

.fx-spark {
  position: absolute;
  width: 8px; height: 8px;
  border-radius: 2px;
  will-change: transform, opacity;
}

/* what a scoring trigger looks like on the thing that produced it */
@keyframes fx-lit {
  0%   { box-shadow: 0 0 0 0 rgba(240,208,137,0); }
  25%  { box-shadow: 0 0 0 3px var(--lit, #f0d089), 0 0 22px 4px var(--lit, #f0d089); }
  100% { box-shadow: 0 0 0 0 rgba(240,208,137,0); }
}
@keyframes fx-jig {
  0%, 100% { transform: translateY(0) rotate(0); }
  30%      { transform: translateY(-9px) rotate(-3deg) scale(1.06); }
  60%      { transform: translateY(-3px) rotate(2deg) scale(1.03); }
}
.fx-lit-chips  { --lit: #6fb6ff; animation: fx-lit .55s ease-out, fx-jig .45s ease-out; z-index: 12; }
.fx-lit-mult   { --lit: #ff8f7d; animation: fx-lit .55s ease-out, fx-jig .45s ease-out; z-index: 12; }
.fx-lit-xmult  { --lit: #ffb26b; animation: fx-lit .7s ease-out, fx-jig .6s ease-out; z-index: 12; }
.fx-lit-bet    { --lit: #f0d089; animation: fx-lit .55s ease-out; z-index: 12; }
.fx-lit-money  { --lit: #d9b45b; animation: fx-lit .55s ease-out; z-index: 12; }
.fx-lit-dead, .fx-lit-warn, .fx-lit-info { --lit: #5d6673; animation: fx-lit .4s ease-out; }

body.no-motion * { transition: none !important; animation: none !important; }

/* ================================================================== */
/*  Editions and stickers                                              */
/* ================================================================== */

.card.ed-foil    { background-image: linear-gradient(135deg, rgba(120,190,255,.30), rgba(255,255,255,.06) 45%, rgba(120,190,255,.22)); }
.card.ed-holo    { background-image: linear-gradient(135deg, rgba(255,120,190,.28), rgba(120,255,220,.20) 50%, rgba(190,120,255,.28)); }
.card.ed-poly    { background-image: linear-gradient(120deg, #ff6b6b40, #ffd93d40 25%, #6bcB7740 50%, #4d96ff40 75%, #b06bff40); background-size: 250% 250%; animation: poly 5s linear infinite; }
.card.ed-negative { background-image: linear-gradient(160deg, rgba(0,0,0,.85), rgba(90,60,140,.55)); border-color: #a457d4; }
@keyframes poly { 0% { background-position: 0% 50%; } 100% { background-position: 250% 50%; } }

.card .sticker {
  position: absolute;
  top: 3px; left: 4px;
  font-size: 11px;
  color: var(--red-hot);
  text-shadow: 0 0 4px rgba(0,0,0,.9);
}

.card.unseen { opacity: .35; filter: grayscale(1); }

/* ================================================================== */
/*  Tags, charters, run meta                                           */
/* ================================================================== */

.tagchip {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border-radius: 7px;
  background: #2b2440;
  border: 1px solid #6b4fa0;
  color: #d9c2ff;
  font-size: 15px;
}
.tagchip.gold { background: #2b2416; border-color: #8a6f26; color: var(--gold-hot); }

.sidebtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

.runmeta {
  display: flex; justify-content: space-between; gap: 6px;
  font-size: 10px; letter-spacing: .06em; color: var(--ink-dim);
  text-transform: uppercase;
}

/* ================================================================== */
/*  Title screen                                                       */
/* ================================================================== */

.titleblurb { max-width: 520px; color: var(--ink-dim); line-height: 1.6; }
.titlepanel { width: min(760px, 92vw); }
.btnrow { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
.hint { font-size: 12px; color: #5d6673; }

.seedinput {
  background: #0d1015; border: 1px solid var(--line); border-radius: 8px;
  color: var(--ink); padding: 9px 14px; text-align: center;
  letter-spacing: .12em; font-family: inherit; width: 260px;
}

/* auto-fill (not auto-fit) keeps the column count, so a short last row
   stays the same cell width instead of stretching. */
.pickrow {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
  gap: 6px;
  margin-top: 6px;
}
.pick {
  background: var(--panel-3);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 7px 4px;
  text-align: center;
  transition: transform .1s, border-color .1s;
}
.pick:hover { transform: translateY(-2px); }
.pick.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold); }
.pick.locked { opacity: .4; }
.pickglyph { font-size: 20px; color: var(--gold); line-height: 1.2; }
.picklbl { font-size: 10px; color: var(--ink-dim); line-height: 1.25; }
.pick.stake .stakedot {
  width: 16px; height: 16px; border-radius: 50%;
  background: var(--stake); margin: 3px auto;
  box-shadow: 0 0 8px var(--stake);
}

/* ================================================================== */
/*  Play screen odds and ends                                          */
/* ================================================================== */

.bethint { text-align: center; margin-top: 8px; font-size: 12px; color: var(--ink-dim); letter-spacing: .1em; }
.enhnote { font-size: 12px; color: var(--gold); }
.tilefoot { height: 38px; color: #5d6673; font-size: 12px; }
.bigline { font-size: 17px; }
.dim { color: var(--ink-dim); }

.unlocks { display: flex; flex-direction: column; gap: 4px; }
.unlockline {
  color: var(--gold-hot); font-size: 13px; letter-spacing: .08em;
  border: 1px solid var(--gold); border-radius: 6px; padding: 5px 14px;
  background: rgba(217,180,91,.09);
}

.cashlines { display: flex; flex-direction: column; gap: 8px; align-items: center; }
.cashline.total { border-top: 1px solid var(--line); margin-top: 4px; font-size: 18px; }

.shopfoot { text-align: center; margin-top: 16px; display: flex; gap: 12px; justify-content: center; align-items: center; }
.tagnote { font-size: 12px; color: var(--gold); }

.card.pack     { background-color: #1d2b33; border-top-color: #4bb6d6; }
.card.fate     { background-color: #2a1a33; border-top-color: #d64bc4; }
.card.enh-card { background-color: #2b2416; border-top-color: var(--gold); }

/* ================================================================== */
/*  Modals                                                             */
/* ================================================================== */

.modalsub { text-align: center; color: var(--ink-dim); font-size: 12px; }
.modalfoot { text-align: center; margin-top: 14px; }

.setrow {
  display: flex; justify-content: space-between; align-items: center;
  gap: 20px; padding: 8px 12px; border-radius: 6px;
  background: rgba(255,255,255,.04); margin-bottom: 6px;
}
.setrow > span { font-size: 13px; }
.sel {
  background: #0d1015; color: var(--ink); border: 1px solid var(--line);

}
input[type=range] { accent-color: var(--gold); width: 160px; }

.histtable { display: flex; flex-direction: column; gap: 3px; margin-top: 8px; }
.histrow {
  display: grid; grid-template-columns: 70px 1fr 1fr 80px 1fr;
  gap: 8px; font-size: 11px; padding: 5px 8px;
  background: rgba(255,255,255,.04); border-radius: 5px; align-items: center;
}
.histrow.won { background: rgba(46,163,106,.16); }
.histrow.won > span:first-child { color: #6fe0a8; font-weight: bold; }
.seedcell { color: #5d6673; letter-spacing: .06em; text-align: right; }

.collection { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }

#tooltip .tsub { color: var(--ink-dim); font-size: 11px; }
#tooltip .tline { font-size: 11px; margin-top: 4px; }
#tooltip .tfoot { margin-top: 6px; color: var(--gold); font-size: 11px; }

/* ================================================================== */
/*  Colourblind palette                                                */
/*  Red/black is the one distinction the whole game rests on, so in     */
/*  this mode red becomes blue rather than a different shade of red.    */
/* ================================================================== */

body.cb { --red: #1f6fb2; --red-hot: #57a7e0; }
body.cb .bet.red::after,
body.cb .pocket-pick.red::after {
  content: '▲';
  position: absolute; left: 2px; top: 0;
  font-size: 8px; opacity: .75; color: #fff;
}
body.cb .bet.black::after,
body.cb .pocket-pick.black::after {
  content: '■';
  position: absolute; left: 2px; top: 0;
  font-size: 8px; opacity: .6; color: #fff;
}

/* Very narrow windows: give the felt its space back by shrinking the sidebar.
   The !important beats the inline grid-template-columns that render() sets. */
@media (max-width: 940px) {
  #app { grid-template-columns: 202px 1fr !important; padding: 8px; gap: 8px; }
  #sidebar { padding: 8px; }
  .felt { padding: 5px; }
  .felt-grid { grid-template-columns: 22px repeat(12, 1fr) 32px; gap: 2px; }
  .bet { font-size: 11px; min-height: 18px; }
  .strip .bet { font-size: 7px; }
  .chipstack { width: 17px; height: 17px; font-size: 10px; }
  .stat .val { font-size: 18px; }
  .card { width: 82px; }
  .slot-empty { width: 82px; }
}

.dangerzone {
  margin-top: 16px;
  padding: 10px 12px;
  border: 1px solid #6b2a24;
  border-radius: 8px;
  background: rgba(192,57,43,.10);
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
}
.dangerzone > span { font-size: 12px; color: #c9857e; }
.btn.danger {
  background: linear-gradient(180deg, #7c2b22, #4d1a14);
  border-color: #b04437;
  color: #ffd9d3;
}

/* ------------------------------------------------------------------ */
/*  Arcade alignment                                                   */
/*  ------------------------------------------------------------------ */
/*  No Limit keeps its felt, its wheel and its palette; these rules pull */
/*  its shape and press-feel onto the shared scale in                   */
/*  shared/css/arcade.css, so corners, panel lift and button response   */
/*  match the rest of the arcade. Appended rather than woven in, so the  */
/*  design-system layer stays legible.                                  */

.panel,
.blindcard,
.scorebox { border-radius: var(--ac-r-md); }

.btn { border-radius: var(--ac-r-md); box-shadow: var(--ac-lift-1); letter-spacing: .08em; }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: none; }
.btn:focus-visible { outline: 2px solid var(--ac-gold); outline-offset: 2px; }

#tooltip { border-radius: var(--ac-r-md); }
.modal-box { border-radius: var(--ac-r-lg); box-shadow: var(--ac-lift-3); }
.seedinput { border-radius: var(--ac-r-sm); }

/* Shared caps treatment: one tracking value for every small uppercase label. */
.brand,
.target .lbl,
.scorebox .lbl,
.section-h,
.screen-title,
.subtitle { letter-spacing: var(--ac-track-caps); }

/* Keep the fixed arcade bar clear of the token bar. The clearance is measured
   from the bar itself, so a long player name cannot grow into the game.
   The stage is a single-column grid whose column would otherwise size to its
   widest row — the token bar, reserved strip included — and stretch the felt
   past the viewport. `minmax(0, 1fr)` pins that column to the stage instead. */
#stage { min-width: 0; grid-template-columns: minmax(0, 1fr); }
#tokenbar { padding-right: calc(var(--ac-bar-w) + var(--ac-s3)); min-width: 0; }

    messagingSenderId: '349479626850',
    appId: '1:349479626850:web:53c7a918d1c80ec764c93b'

       name       display name
       tagline    one line, used on the hub and in the game switcher
       glyph      a single character used as the game's mark
       path       location relative to the arcade root (one-origin deploys)
       url        absolute origin for this game, used once deployed; the

  Arcade.games = [
    {
      id: 'pegfall',
      name: 'PEGFALL',
      tagline: 'a plinko roguelite',
      glyph: '●',
      path: 'Plinko/index.html',
      url: 'https://pegfall.marsindustries.dev/',
      theme: 'pegfall',
      metrics: [
        { id: 'score', label: 'Run score' },
        { id: 'floor', label: 'Deepest floor' },
        { id: 'bestBall', label: 'Best single ball' }
      ],
      scoreMax: 1e12,
      metaFields: ['floor']
    },
    {
      id: 'onemoreroll',
      name: 'One More Roll',
      tagline: 'a dice roguelite',
      glyph: '▣',
      path: 'Yahtzee Roguelike/index.html',
      url: 'https://onemoreroll.marsindustries.dev/',
      theme: 'onemoreroll',
      metrics: [
        { id: 'score', label: 'Best turn' },
        { id: 'ante', label: 'Furthest ante' },
        { id: 'money', label: 'Money earned' }
      ],
      scoreMax: 1e15,
      metaFields: ['ante']
    },
    {
      id: 'nolimit',
      name: 'No Limit',
      tagline: 'a roulette roguelike',
      glyph: '◎',
      path: 'Roulette Roguelike/index.html',
      url: 'https://nolimit.marsindustries.dev/',
      theme: 'nolimit',
      metrics: [
        { id: 'score', label: 'Best spin' },
        { id: 'ante', label: 'Furthest ante' },
        { id: 'tables', label: 'Tables cleared' }
      ],
      scoreMax: 1e15,
      metaFields: ['ante']
    }
  ];

  /* Absolute home of the arcade hub, for subdomain deploys. */
  Arcade.hubUrl = 'https://arcade.marsindustries.dev/';

  /* --------------------------------------------------------------------
     Shared sign-in across the subdomains.

     A Firebase session belongs to one origin, so without this you would sign
     in once per game. Every site instead talks to a hidden broker page served
     from the hub, which holds the single session they all share. If it cannot
     load, each site quietly falls back to its own sign-in.

     `url` must be on the hub's origin. `testLocally` runs the same path on a
     dev server, where everything is one origin anyway — useful for exercising
     the RPC, pointless otherwise.

    enabled: true,
    url: 'https://arcade.marsindustries.dev/shared/broker.html',
    timeoutMs: 12000,
    testLocally: false

   * True when this page is being browsed locally rather than served from the
   * real domains — a dev server, or a double-clicked file://.

    return h === 'localhost' || h === '127.0.0.1' || h === '[::1]' || h === '';
  };

  /**
   * Where the switcher and the hub link for a game.
   *
   * Deployed, the absolute `url` wins — that is what makes the subdomain split
   * work, where '../Plinko/index.html' would point at nothing. Browsed locally
   * the relative path wins instead, so filling in the live URLs does not send
   * you off to production every time you click the switcher on a dev server.
   */

    if (game && game.url && !Arcade.isLocal()) return game.url;
    return Arcade.options.rootPath + (game ? game.path : '');

    if (Arcade.hubUrl && !Arcade.isLocal()) return Arcade.hubUrl;
    return Arcade.options.rootPath + Arcade.options.hubPath;

  /* --- metric helpers -------------------------------------------------
     The primary metric lives in the row's `score` field and the rest under
     `metrics.<id>`, so the headline board keeps the strict "can only go up"
     rule while new categories need no rules change. */

  Arcade.metricById = function (game, id) {

  Arcade.metricField = function (game, id) {
    return id === Arcade.primaryMetric(game).id ? 'score' : 'metrics.' + id;
  };

  Arcade.gameById = function (id) {
    for (var i = 0; i < Arcade.games.length; i++) {
      if (Arcade.games[i].id === id) return Arcade.games[i];
    }
    return { id: id, name: id, glyph: '◆', scoreLabel: 'Score',
             metrics: [{ id: 'score', label: 'Score' }], metaFields: [] };
  };

  /* --------------------------------------------------------------------
     3. Platform options
     -------------------------------------------------------------------- */
  Arcade.options = {
    topN: 5,               // how many rows the leaderboard shows
    rankScanLimit: 200,    // fallback rank scan depth when count() is absent
    minNameLength: 3,
    maxNameLength: 20,
    /* How far above the arcade root each game sits, so the game switcher can
       build links. Overridden per game in Arcade.init if a game is deployed
       standalone. */
    rootPath: '../',

    hubPath: 'hub/index.html'

     They are gone now — this arcade points at a real project. */

<script>
// ===== shared/js/arcade-auth.js
/* ============================================================================
   arcade-auth.js — one Firebase app, one account, shared by every game.

   Responsibilities
     * lazily pull the Firebase compat SDK from the CDN (only when configured)
     * initialise the app exactly once per page
     * sign in / register / sign out, with persistent sessions
     * resolve the auth state on boot before anything asks "who is playing?"
     * translate Firebase error codes into sentences a player can act on

   Because every game points at the same Firebase project, signing in to one
   game signs you in to all of them.
   ========================================================================= */
(function (global) {
  'use strict';

  var Arcade = global.Arcade = global.Arcade || {};

  var state = {
    status: 'idle',      // idle | offline | connecting | ready | error
    user: null,          // { uid, email, displayName }
    profile: null,       // the users/{uid} document
    error: null
  };
  var listeners = [];
  var readyResolve;
  var readyPromise = new Promise(function (res) { readyResolve = res; });
  var initPromise = null;

  var fb = { app: null, auth: null, db: null };

  /* ------------------------------------------------------------------ CDN */

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var existing = document.querySelector('script[data-arcade-sdk="' + src + '"]');
      if (existing) {
        if (existing.dataset.loaded === '1') return resolve();
        existing.addEventListener('load', function () { resolve(); });
        existing.addEventListener('error', function () { reject(new Error('sdk')); });
        return;
      }
      var s = document.createElement('script');
      s.src = src;
      s.async = false;                 // keep compat load order deterministic
      s.dataset.arcadeSdk = src;
      s.addEventListener('load', function () { s.dataset.loaded = '1'; resolve(); });
      s.addEventListener('error', function () { reject(new Error('Could not load ' + src)); });
      document.head.appendChild(s);
    });
  }

  function loadSdk() {
    var v = Arcade.sdkVersion;
    var base = 'https://www.gstatic.com/firebasejs/' + v + '/';
    return loadScript(base + 'firebase-app-compat.js')
      .then(function () { return loadScript(base + 'firebase-auth-compat.js'); })
      .then(function () { return loadScript(base + 'firebase-firestore-compat.js'); });
  }

  /* ----------------------------------------------------------------- init */

  function emit() {
    listeners.slice().forEach(function (fn) {
      try { fn(state); } catch (e) { /* a bad listener must not stop the rest */ }
    });
  }

  function setState(patch) {
    Object.assign(state, patch);
    emit();
  }

  /**
   * Boot the platform. Safe to call from every game on every page load;
   * subsequent calls return the same promise.
   */
  function init() {
    if (initPromise) return initPromise;

    if (!Arcade.isConfigured()) {
      setState({ status: 'offline' });
      readyResolve(state);
      initPromise = Promise.resolve(state);
      return initPromise;
    }

    setState({ status: 'connecting' });

    initPromise = loadSdk().then(function () {
      var firebase = global.firebase;
      fb.app = firebase.apps.length ? firebase.app() : firebase.initializeApp(Arcade.firebaseConfig);
      fb.auth = firebase.auth();
      fb.db = firebase.firestore();
      Arcade.fb = fb;
      connectEmulators();

      // Sessions survive reloads and tab closes. This is the default, but
      // stating it means a future SDK default change cannot silently log
      // every player out.
      return fb.auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL)
        .catch(function () { /* private mode: fall back to whatever works */ });
    }).then(function () {
      // The first callback is the "auth state checked at startup" moment.
      var settled = false;
      return new Promise(function (resolve) {
        fb.auth.onAuthStateChanged(function (u) {
          if (u) {
            state.user = { uid: u.uid, email: u.email, displayName: u.displayName || '' };
            ensureProfile(u).then(function (p) {
              state.profile = p;
              setState({ status: 'ready', error: null });
              if (!settled) { settled = true; readyResolve(state); resolve(state); }
            });
          } else {
            state.user = null;
            state.profile = null;
            setState({ status: 'ready', error: null });
            if (!settled) { settled = true; readyResolve(state); resolve(state); }
          }
        }, function (err) {
          setState({ status: 'error', error: describe(err) });
          if (!settled) { settled = true; readyResolve(state); resolve(state); }
        });
      });
    }).catch(function (err) {
      // A blocked CDN, an offline machine, a mistyped project id. The games
      // must keep working, so degrade to offline rather than throwing.
      setState({ status: 'offline', error: describe(err) });
      readyResolve(state);
      return state;
    });

    return initPromise;
  }

  /** Local development against `firebase emulators:start`. Ignored unless the
      page is on localhost, so it cannot misdirect a deployed build. */
  function connectEmulators() {
    var e = Arcade.emulator;
    if (!e) return;
    var host = global.location && global.location.hostname;
    if (host !== 'localhost' && host !== '127.0.0.1' && host !== '[::1]') return;
    try {
      if (e.auth) fb.auth.useEmulator('http://' + host + ':' + e.auth, { disableWarnings: true });
      if (e.firestore) fb.db.useEmulator(host, e.firestore);
      state.emulated = true;
    } catch (err) { /* already connected on a soft reload */ }
  }

  /* -------------------------------------------------------------- profile */

  /* Registration and the auth-state listener both race to create the profile
     document: createUserWithEmailAndPassword fires onAuthStateChanged before
     updateProfile has run, so whichever lands first decides the name. This
     holds the chosen name across that gap so both writers agree on it. */
  var pendingName = null;

  /** The users/{uid} document: the display name every leaderboard row copies. */
  function ensureProfile(u) {
    var ref = fb.db.collection('users').doc(u.uid);
    var wanted = pendingName || u.displayName || defaultName(u);
    return ref.get().then(function (snap) {
      if (snap.exists) return Object.assign({ uid: u.uid }, snap.data());
      return writeProfile(u.uid, wanted, false).then(function () {
        return { uid: u.uid, displayName: wanted };
      });
    }).catch(function () {
      // Rules or connectivity: fall back to a local-only view of the user so
      // the UI can still show who is signed in.
      return { uid: u.uid, displayName: wanted };
    });
  }

  /**
   * Write the profile, as a create or an update depending on what is already
   * there.
   *
   * The distinction matters: the rules only let an update touch the name and
   * updatedAt, so a blind set() over an existing document re-sends uid and
   * createdAt and is refused. `exists` is passed when the caller already knows.
   */
  function writeProfile(uid, name, exists) {
    var ref = fb.db.collection('users').doc(uid);
    var stampNow = global.firebase.firestore.FieldValue.serverTimestamp();

    function update() {
      return ref.update({
        displayName: name,
        displayNameLower: name.toLowerCase(),
        updatedAt: stampNow
      });
    }
    function create() {
      return ref.set({
        uid: uid,
        displayName: name,
        displayNameLower: name.toLowerCase(),
        createdAt: stampNow,
        updatedAt: stampNow
      });
    }

    if (exists === true) return update();
    if (exists === false) {
      // Lost the race: the other writer created it, so fall back to an update.
      return create().catch(function () { return update(); });
    }
    return ref.get().then(function (snap) { return snap.exists ? update() : create(); });
  }

  function defaultName(u) {
    return (u.email || 'player').split('@')[0].slice(0, Arcade.options.maxNameLength);
  }

  /* ----------------------------------------------------------- operations */

  function requireReady() {
    if (state.status === 'offline') {
      return Promise.reject(new Error('OFFLINE'));
    }
    return init();
  }

  function signIn(email, password) {
    return requireReady().then(function () {
      return fb.auth.signInWithEmailAndPassword(String(email).trim(), password);
    }).then(function (cred) { return cred.user; });
  }

  function register(email, password, displayName) {
    var name = String(displayName || '').trim();
    var opts = Arcade.options;
    if (name.length < opts.minNameLength || name.length > opts.maxNameLength) {
      return Promise.reject(new Error('NAME_LENGTH'));
    }
    if (!/^[\w .'-]+$/.test(name)) return Promise.reject(new Error('NAME_CHARS'));

    return requireReady().then(function () {
      // Claimed before the account exists, so the auth-state listener that
      // fires inside createUser already knows which name to write.
      pendingName = name;
      return fb.auth.createUserWithEmailAndPassword(String(email).trim(), password);
    }).then(function (cred) {
      return cred.user.updateProfile({ displayName: name }).then(function () {
        return writeProfile(cred.user.uid, name);
      }).then(function () {
        pendingName = null;
        state.user = { uid: cred.user.uid, email: cred.user.email, displayName: name };
        state.profile = { uid: cred.user.uid, displayName: name };
        emit();
        return cred.user;
      });
    }).catch(function (err) {
      pendingName = null;
      throw err;
    });
  }

  function signOut() {
    if (state.status === 'offline' || !fb.auth) return Promise.resolve();
    return fb.auth.signOut();
  }

  function sendReset(email) {
    return requireReady().then(function () {
      return fb.auth.sendPasswordResetEmail(String(email).trim());
    });
  }

  /** Rename: the users doc is the source of truth; leaderboard rows follow. */
  function setDisplayName(name) {
    name = String(name || '').trim();
    var opts = Arcade.options;
    if (name.length < opts.minNameLength || name.length > opts.maxNameLength) {
      return Promise.reject(new Error('NAME_LENGTH'));
    }
    if (!state.user) return Promise.reject(new Error('SIGNED_OUT'));

    return fb.auth.currentUser.updateProfile({ displayName: name }).then(function () {
      return writeProfile(state.user.uid, name);
    }).then(function () {
      state.user.displayName = name;
      if (state.profile) state.profile.displayName = name;
      emit();
      if (Arcade.scores && Arcade.scores.renameEntries) Arcade.scores.renameEntries(name);
      return name;
    });
  }

  /* --------------------------------------------------------------- errors */

  var MESSAGES = {
    'auth/invalid-email': 'That does not look like an email address.',
    'auth/user-disabled': 'This account has been disabled.',
    'auth/user-not-found': 'No account with that email. Register instead?',
    'auth/wrong-password': 'Wrong email or password.',
    'auth/invalid-credential': 'Wrong email or password.',
    'auth/invalid-login-credentials': 'Wrong email or password.',
    'auth/email-already-in-use': 'That email is already registered. Sign in instead?',
    'auth/weak-password': 'Pick a password of at least 6 characters.',
    'auth/missing-password': 'Enter your password.',
    'auth/too-many-requests': 'Too many attempts. Wait a minute and try again.',
    'auth/network-request-failed': 'No connection to the arcade. Check your network.',
    'auth/operation-not-allowed': 'Email sign-in is switched off for this project.',
    /* Thrown when Authentication has never been initialised in the Firebase
       project — the sign-in method list does not exist yet. Distinct from
       operation-not-allowed, which means it exists but email is off. */
    'auth/configuration-not-found': 'Accounts are not switched on for this arcade yet.',
    'auth/admin-restricted-operation': 'New accounts are closed on this arcade right now.',
    'auth/internal-error': 'The sign-in service had a problem. Try again in a moment.',
    'auth/unauthorized-domain': 'This domain is not authorised in the Firebase project.',
    'permission-denied': 'The arcade refused that. You can only change your own data.',
    'unavailable': 'The arcade is unreachable right now. Your run is saved locally.',
    OFFLINE: 'The arcade is not configured yet — playing offline.',
    NAME_LENGTH: 'Your name needs 3 to 20 characters.',
    NAME_CHARS: 'Letters, numbers, spaces, . - and ’ only, please.',
    SIGNED_OUT: 'You are signed out.'
  };

  function describe(err) {
    if (!err) return 'Something went wrong.';
    var code = err.code || err.message || '';
    return MESSAGES[code] || err.message || 'Something went wrong.';
  }

  /* ------------------------------------------------------------------ api */

  Arcade.auth = {
    init: init,
    /* Resolves once *a* backend has settled the auth state — the direct
       Firebase path here, or the cross-subdomain broker driving it from the
       hub's origin. It must not force the direct path, or asking "who is
       playing?" would start a second, origin-local session. */
    ready: function () {
      if (!Arcade.broker || !Arcade.broker.active()) init();
      return readyPromise;

    get state() { return state; },
    get user() { return state.user; },
    get status() { return state.status; },
    isSignedIn: function () { return !!state.user; },

    onChange: function (fn) {

      if (state.status !== 'idle') { try { fn(state); } catch (e) {} }

    register: register,
    signOut: signOut,
    sendReset: sendReset,
    setDisplayName: setDisplayName,
    describe: describe,

    /* Used only by arcade-broker.js, which owns the session on the hub's
       origin and mirrors it in here. Everything above reads this state, so
       the UI never needs to know which backend it is talking to. */
    _adopt: function (next) {
      state.user = next.user || null;
      state.profile = next.profile || null;

    _override: function (impl) {
      Object.keys(impl).forEach(function (k) { Arcade.auth[k] = impl[k]; });
    }

<script>
// ===== shared/js/arcade-scores.js
/* ============================================================================
   arcade-scores.js — submission, leaderboards and ranking.

   Firestore shape (see ARCADE.md for the reasoning):

     users/{uid}
         displayName, displayNameLower, createdAt, updatedAt

     leaderboards/{gameId}/entries/{uid}          <- one row per player/game
         uid, gameId, displayName, score (best), plays, meta, firstAt, updatedAt

     runs/{runId}                                 <- append-only history
         uid, gameId, score, meta, createdAt

   A leaderboard is therefore a subcollection keyed by game id. Adding a game
   creates its subcollection on the first write — no schema migration, no new
   rules, no new index.
   ========================================================================= */
(function (global) {
  'use strict';

  var Arcade = global.Arcade = global.Arcade || {};

  function db() { return Arcade.fb && Arcade.fb.db; }
  function stamp() { return global.firebase.firestore.FieldValue.serverTimestamp(); }
  function inc(n) { return global.firebase.firestore.FieldValue.increment(n); }

  function entriesRef(gameId) {
    return db().collection('leaderboards').doc(gameId).collection('entries');
  }

  /** Strip a meta blob down to what the rules will accept: shallow, small,
      primitives only. Keeps a game from accidentally posting its whole run. */
  function cleanMeta(meta) {
    var out = {};
    if (!meta) return out;
    var keys = Object.keys(meta).slice(0, 8);
    keys.forEach(function (k) {
      var v = meta[k];
      if (typeof v === 'number' && isFinite(v)) out[k] = v;
      else if (typeof v === 'boolean') out[k] = v;
      else if (typeof v === 'string') out[k] = v.slice(0, 40);
    });
    return out;
  }

  /* --------------------------------------------------------------- submit */

  /** Keep only declared metrics, as non-negative integers under the ceiling. */
  function cleanMetrics(game, metrics) {
    var out = {};
    if (!metrics) return out;
    var primary = Arcade.primaryMetric(game).id;
    Arcade.metricsOf(game).forEach(function (m) {
      if (m.id === primary) return;               // the primary lives in `score`
      var v = Number(metrics[m.id]);
      if (!isFinite(v) || v < 0) return;
      out[m.id] = Math.min(Math.floor(v), game.scoreMax);
    });
    return out;
  }

  /**
   * Record the result of a finished run.
   *
   * Always appends to `runs` (so "games played" and score history are real),
   * lifts the player's headline row only when the run beat their best, and
   * keeps every secondary metric at its own best independently.
   *
   * Resolves to { ok, skipped, best, isRecord, rank } and never rejects — a
   * dead network must not interrupt a game-over screen.
   *
   * @param payload either a number (the primary metric — the original call
   *        shape, still supported) or { score, metrics, meta }.
   */
  function submit(gameId, payload, meta) {
    var game = Arcade.gameById(gameId);
    var user = Arcade.auth.user;
    var score = payload;
    var metrics = null;
    if (payload && typeof payload === 'object') {
      score = payload.score;
      metrics = payload.metrics;
      if (meta === undefined) meta = payload.meta;
    }

    if (!Arcade.isConfigured() || !db()) {
      return Promise.resolve({ ok: false, skipped: 'offline' });
    }
    if (!user) return Promise.resolve({ ok: false, skipped: 'signed-out' });

    score = Number(score);
    if (!isFinite(score) || score < 0) return Promise.resolve({ ok: false, skipped: 'invalid' });
    score = Math.floor(score);
    if (score > game.scoreMax) score = game.scoreMax;

    var clean = cleanMeta(meta);
    var cleanM = cleanMetrics(game, metrics);
    var name = Arcade.auth.displayName();
    var ref = entriesRef(gameId).doc(user.uid);

    var runWrite = db().collection('runs').add({
      uid: user.uid,
      gameId: gameId,
      score: score,
      meta: clean,
      createdAt: stamp()
    }).catch(function () { /* history is best-effort */ });

    var entryWrite = db().runTransaction(function (tx) {
      return tx.get(ref).then(function (snap) {
        if (!snap.exists) {
          tx.set(ref, {
            uid: user.uid,
            gameId: gameId,
            displayName: name,
            score: score,
            metrics: cleanM,
            plays: 1,
            meta: clean,
            firstAt: stamp(),
            updatedAt: stamp()
          });
          return { best: score, isRecord: true };
        }
        var prev = snap.data();
        var beat = score > (prev.score || 0);
        var patch = {
          displayName: name,
          plays: inc(1),
          updatedAt: stamp()
        };
        if (beat) { patch.score = score; patch.meta = clean; }

        /* Each secondary metric is its own board, so it keeps its own best
           whether or not this run beat the headline number. */
        var prevM = prev.metrics || {};
        var merged = {};
        var moved = false;
        Object.keys(cleanM).forEach(function (k) {
          var best = Math.max(cleanM[k], prevM[k] || 0);
          merged[k] = best;
          if (best !== prevM[k]) moved = true;
        });
        Object.keys(prevM).forEach(function (k) {
          if (merged[k] === undefined) merged[k] = prevM[k];
        });
        if (moved) patch.metrics = merged;

        tx.update(ref, patch);
        return { best: beat ? score : (prev.score || 0), isRecord: beat };
      });
    });

    return Promise.all([runWrite, entryWrite]).then(function (r) {
      var res = r[1];
      return rankOf(gameId, res.best).then(function (rank) {
        return { ok: true, best: res.best, isRecord: res.isRecord, rank: rank, score: score };
      });
    }).catch(function (err) {
      return { ok: false, error: Arcade.auth.describe(err) };
    });
  }

  /* ----------------------------------------------------------------- rank */

  /**
   * How many players beat `score`, plus one. Uses a server-side count when the
   * SDK offers it and falls back to scanning the top of the board, which is
   * exact for anyone inside `rankScanLimit` and honest about it beyond that.
   */
  function rankOf(gameId, score, metricId) {
    if (!db() || !isFinite(score)) return Promise.resolve(null);
    var field = Arcade.metricField(Arcade.gameById(gameId), metricId);
    var q = entriesRef(gameId).where(field, '>', score);

    if (typeof q.count === 'function') {
      return q.count().get()
        .then(function (agg) { return agg.data().count + 1; })
        .catch(function () { return scanRank(gameId, score, field); });
    }
    return scanRank(gameId, score, field);
  }

  /** Read a metric off a row, whether it is the primary or a nested one. */
  function valueAt(data, field) {
    if (field === 'score') return data.score || 0;
    var key = field.slice('metrics.'.length);
    return (data.metrics && data.metrics[key]) || 0;
  }

  function scanRank(gameId, score, field) {
    var limit = Arcade.options.rankScanLimit;
    return entriesRef(gameId).orderBy(field, 'desc').limit(limit).get()
      .then(function (snap) {
        var above = 0;
        snap.forEach(function (d) { if (valueAt(d.data(), field) > score) above++; });
        if (above >= limit) return { atLeast: limit + 1 };
        return above + 1;
      })
      .catch(function () { return null; });
  }

  /* ---------------------------------------------------------- leaderboard */

  /**
   * Top N plus the signed-in player's own standing.
   * Resolves to { rows, you, offline, error } — `you` is null when the player
   * is signed out or has never posted a score.
   */
  function board(gameId, topN, metricId) {
    topN = topN || Arcade.options.topN;
    var game = Arcade.gameById(gameId);
    var metric = Arcade.metricById(game, metricId);
    var field = Arcade.metricField(game, metric.id);

    if (!Arcade.isConfigured() || !db()) {
      return Promise.resolve({ rows: [], you: null, offline: true, metric: metric.id });
    }

    /* A row that has never recorded this metric simply has no such field, so
       Firestore leaves it out of the ordered index — an unplayed category is
       absent from its board rather than sitting at the bottom on zero. */
    return entriesRef(gameId).orderBy(field, 'desc').limit(topN).get()
      .then(function (snap) {
        var rows = [];
        snap.forEach(function (d, i) {
          var v = d.data();
          rows.push({
            uid: v.uid || d.id,
            rank: rows.length + 1,
            name: v.displayName || 'Player',
            score: valueAt(v, field),
            plays: v.plays || 0,
            meta: v.meta || {}
          });
        });

        var user = Arcade.auth.user;
        if (!user) return { rows: rows, you: null, metric: metric.id };

        var inTop = null;
        rows.forEach(function (r) { if (r.uid === user.uid) { r.you = true; inTop = r; } });
        if (inTop) return { rows: rows, you: inTop, youInTop: true, metric: metric.id };

        // Outside the top N: fetch the player's own row and rank it.
        return entriesRef(gameId).doc(user.uid).get().then(function (mine) {
          if (!mine.exists) return { rows: rows, you: null, metric: metric.id };
          var v = mine.data();
          var mineValue = valueAt(v, field);
          return rankOf(gameId, mineValue, metric.id).then(function (rank) {
            return {
              rows: rows,
              metric: metric.id,
              you: {
                uid: user.uid,
                rank: rank,
                name: v.displayName || Arcade.auth.displayName(),
                score: mineValue,
                plays: v.plays || 0,
                meta: v.meta || {},
                you: true
              },
              youInTop: false
            };
          });
        });
      })
      .catch(function (err) {
        return { rows: [], you: null, metric: metric.id, error: Arcade.auth.describe(err) };
      });
  }

  /** Every game's top row plus the player's standing — used by the hub. */
  function summary() {
    return Promise.all(Arcade.games.map(function (g) {
      return board(g.id, Arcade.options.topN).then(function (b) {
        return { game: g, board: b };
      });
    }));
  }

  /** The player's own row in each game, for the account panel. */
  function myStandings() {
    var user = Arcade.auth.user;
    if (!user || !db()) return Promise.resolve([]);
    return Promise.all(Arcade.games.map(function (g) {
      return entriesRef(g.id).doc(user.uid).get().then(function (snap) {
        if (!snap.exists) return { game: g, entry: null };
        var v = snap.data();
        return rankOf(g.id, v.score || 0).then(function (rank) {
          return { game: g, entry: { score: v.score || 0, plays: v.plays || 0, rank: rank } };
        });
      }).catch(function () { return { game: g, entry: null }; });
    }));
  }

  /** After a rename, carry the new name onto the rows the player owns. */
  function renameEntries(name) {
    var user = Arcade.auth.user;
    if (!user || !db()) return Promise.resolve();
    return Promise.all(Arcade.games.map(function (g) {
      return entriesRef(g.id).doc(user.uid)
        .update({ displayName: name, updatedAt: stamp() })
        .catch(function () { /* no row for that game yet */ });
    }));
  }

  Arcade.scores = {
    submit: submit,
    board: board,
    rankOf: rankOf,
    summary: summary,
    myStandings: myStandings,
    renameEntries: renameEntries
  };
})(typeof window !== 'undefined' ? window : this);
</script>
<script>
// ===== shared/js/arcade-catalogue.js
/* ============================================================================
   arcade-catalogue.js — what there is to earn, unlock and achieve.

   Pure data. arcade-progress.js is the machinery that reads it, so adding a
   currency, an unlock, a difficulty or an achievement is an edit here and
   nothing else.

   Every achievement carries a `steam` id. Nothing reads it yet — it is the
   seam that lets a Steam build map these onto real achievements later without
   renaming anything players have already earned.
   ========================================================================= */
(function (global) {
  'use strict';

  var Arcade = global.Arcade = global.Arcade || {};

  /* --------------------------------------------------------------------
     Per-game progression.

       currency   { id, label, icon } — one per game, earned by playing
       earn(s)    -> how much a finished run is worth, from its summary
       unlocks[]  { id, label, desc, cost, effect } — bought with currency
       difficulties[] { id, label } — the ladder a clear is recorded against

     `effect` is a free-form tag the game itself reads. The catalogue says
     what exists; the game decides what it means.
     -------------------------------------------------------------------- */
  Arcade.progression = {

    pegfall: {
      currency: { id: 'shards', label: 'Shards', icon: '◈' },
      // Depth is worth more than raw score, so a deep careful run pays better
      // than one lucky floor.
      earn: function (s) {
        return Math.max(1, Math.floor((s.score || 0) / 500) + (s.floor || 0) * 2);
      },
      unlocks: [
        { id: 'ball_bomb', label: 'Bomb ball', cost: 20, effect: 'ball:bomb',
          desc: 'Adds the Bomb ball to the shop pool, without waiting for floor 3.' },
        { id: 'ball_ghost', label: 'Ghost ball', cost: 35, effect: 'ball:ghost',
          desc: 'Adds the Ghost ball to the shop pool, without waiting for floor 5.' },
        { id: 'ball_magnet', label: 'Magnet ball', cost: 55, effect: 'ball:magnet',
          desc: 'Adds the Magnet ball to the shop pool, without waiting for floor 7.' },
        { id: 'ball_void', label: 'Void ball', cost: 80, effect: 'ball:voidball',
          desc: 'Adds the Void ball to the shop pool, without waiting for floor 9.' },
        { id: 'deep_pockets', label: 'Deep Pockets', cost: 45, effect: 'gold:4',
          desc: 'Start every run with 4 extra gold.' }
      ],
      /* PEGFALL has no difficulty ladder and no win condition — it is endless
         and ends when you fall short. One tier keeps the shape of the system
         without inventing a completion bar the game does not have. */
      difficulties: [{ id: 'standard', label: 'Standard' }]
    },

    onemoreroll: {
      currency: { id: 'pips', label: 'Pips', icon: '⁙' },
      earn: function (s) {
        return Math.max(1, (s.ante || 0) * 3 + Math.floor((s.score || 0) / 2000) + (s.won ? 25 : 0));
      },
      unlocks: [
        { id: 'lucky_start', label: 'Lucky Start', cost: 25, effect: 'money:4',
          desc: 'Start every run with $4 extra.' },
        { id: 'sixth_die', label: 'Sixth Die', cost: 70, effect: 'dice:1',
          desc: 'Start every run with one extra die.' },
        { id: 'deep_pockets', label: 'Deep Pockets', cost: 45, effect: 'consumable:1',
          desc: 'One more consumable slot, every run.' }
      ],
      difficulties: [
        { id: '1', label: 'White Peril' }, { id: '2', label: 'Red Peril' },
        { id: '3', label: 'Green Peril' }, { id: '4', label: 'Black Peril' },
        { id: '5', label: 'Blue Peril' }, { id: '6', label: 'Purple Peril' },
        { id: '7', label: 'Orange Peril' }, { id: '8', label: 'Gold Peril' }
      ]
    },

    nolimit: {
      currency: { id: 'markers', label: 'Markers', icon: '◉' },
      earn: function (s) {
        return Math.max(1, (s.ante || 0) * 3 + (s.tables || 0) * 2 + (s.won ? 25 : 0));
      },
      unlocks: [
        { id: 'deep_purse', label: 'Deep Purse', cost: 25, effect: 'money:4',
          desc: 'Start every run with $4 extra.' },
        { id: 'spare_nudge', label: 'Spare Nudge', cost: 60, effect: 'nudge:1',
          desc: 'One more Nudge every round.' },
        { id: 'house_edge', label: 'House Edge', cost: 45, effect: 'chips:1',
          desc: 'One more chip to place every round.' }
      ],
      difficulties: [
        { id: 'white', label: 'White Stake' }, { id: 'red', label: 'Red Stake' },
        { id: 'green', label: 'Green Stake' }, { id: 'black', label: 'Black Stake' },
        { id: 'blue', label: 'Blue Stake' }, { id: 'purple', label: 'Purple Stake' },
        { id: 'orange', label: 'Orange Stake' }, { id: 'gold', label: 'Gold Stake' }
      ]
    }
  };

  /* --------------------------------------------------------------------
     Achievements.

       id     stable for ever — it is the save key
       game   null for arcade-wide ones
       label  what the player sees
       desc   how to get it
       secret true hides the description until earned
       steam  the id a Steam build would map this onto
       test(s, store) evaluated when a run ends; omit for ones the game
              awards directly with Arcade.progress.award()
     -------------------------------------------------------------------- */
  Arcade.achievements = [
    /* ---- arcade-wide ---- */
    { id: 'first_run', game: null, label: 'Taking a Seat', steam: 'ACH_FIRST_RUN',
      desc: 'Finish a run in any game.',
      test: function (s, st) { return st.totals.runs >= 1; } },
    { id: 'house_regular', game: null, label: 'House Regular', steam: 'ACH_HOUSE_REGULAR',
      desc: 'Finish 25 runs across the arcade.',
      test: function (s, st) { return st.totals.runs >= 25; } },
    { id: 'full_floor', game: null, label: 'Working the Floor', steam: 'ACH_FULL_FLOOR',
      desc: 'Finish a run in all three games.',
      test: function (s, st) {
        return Arcade.games.every(function (g) { return (st.games[g.id] || {}).runs > 0; });
      } },

    /* ---- PEGFALL ---- */
    { id: 'pegfall_floor5', game: 'pegfall', label: 'Down the Board', steam: 'ACH_PEGFALL_FLOOR_5',
      desc: 'Reach floor 5.', test: function (s) { return (s.floor || 0) >= 5; } },
    { id: 'pegfall_floor10', game: 'pegfall', label: 'Basement Dweller', steam: 'ACH_PEGFALL_FLOOR_10',
      desc: 'Reach floor 10.', test: function (s) { return (s.floor || 0) >= 10; } },
    { id: 'pegfall_bigball', game: 'pegfall', label: 'One Good Drop', steam: 'ACH_PEGFALL_BIG_BALL',
      desc: 'Score 1,000 with a single ball.', test: function (s) { return (s.bestBall || 0) >= 1000; } },
    { id: 'pegfall_collector', game: 'pegfall', label: 'Magpie', steam: 'ACH_PEGFALL_COLLECTOR',
      desc: 'Hold 6 relics at once.', test: function (s) { return (s.relics || 0) >= 6; } },

    /* ---- One More Roll ---- */
    { id: 'omr_win', game: 'onemoreroll', label: 'One More Win', steam: 'ACH_OMR_WIN',
      desc: 'Beat The Grand.', test: function (s) { return !!s.won; } },
    { id: 'omr_bigturn', game: 'onemoreroll', label: 'Hot Dice', steam: 'ACH_OMR_BIG_TURN',
      desc: 'Score 10,000 in a single turn.', test: function (s) { return (s.score || 0) >= 10000; } },
    { id: 'omr_ante5', game: 'onemoreroll', label: 'Deep in the Night', steam: 'ACH_OMR_ANTE_5',
      desc: 'Reach ante 5.', test: function (s) { return (s.ante || 0) >= 5; } },
    // Awarded in the moment rather than at run end: it is about a thing you
    // did, not a number you finished on.
    { id: 'omr_encore', game: 'onemoreroll', label: 'Encore!', steam: 'ACH_OMR_ENCORE',
      desc: 'Score the same category twice in one blind.' },

    /* ---- No Limit ---- */
    { id: 'nolimit_win', game: 'nolimit', label: 'The House Folds', steam: 'ACH_NOLIMIT_WIN',
      desc: 'Take eight antes off the house.', test: function (s) { return !!s.won; } },
    { id: 'nolimit_bigspin', game: 'nolimit', label: 'Let It Ride', steam: 'ACH_NOLIMIT_BIG_SPIN',
      desc: 'Score 100,000 on a single spin.', test: function (s) { return (s.score || 0) >= 100000; } },
    { id: 'nolimit_ante5', game: 'nolimit', label: 'Still Standing', steam: 'ACH_NOLIMIT_ANTE_5',
      desc: 'Reach ante 5.', test: function (s) { return (s.ante || 0) >= 5; } },
    { id: 'nolimit_carve', game: 'nolimit', label: 'Rewriting the Odds', steam: 'ACH_NOLIMIT_CARVE',
      desc: 'Remove 10 pockets from the wheel in one run.',
      test: function (s) { return (s.pocketsRemoved || 0) >= 10; } }
  ];

  Arcade.achievementById = function (id) {
    for (var i = 0; i < Arcade.achievements.length; i++) {
      if (Arcade.achievements[i].id === id) return Arcade.achievements[i];
    }
    return null;
  };

  Arcade.progressionOf = function (gameId) {
    return Arcade.progression[gameId] || null;
  };
})(typeof window !== 'undefined' ? window : this);
