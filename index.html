// ===== src/audio.js =====================================================

// Every sound in the game is synthesised at runtime. No audio files means the
// bundled index.html stays a single self-contained document.
//
// Browsers refuse to start an AudioContext before a user gesture, so the
// context is created lazily on the first interaction and everything before that
// is silently dropped.
//
// Signal path:  voices -> (spin bus) -> master -> limiter -> destination
// The limiter exists so that stacking sounds can never clip, and the spin bus
// exists so the ball rattle can be cut short when a spin is skipped.



let auCtx = null;
let auMaster = null;
let auLimiter = null;
let auSpinBus = null;
let auNoiseBuf = null;
let auBroken = false;

// Each voice is 2-3 nodes. Past this many at once the audio thread starts to
// struggle on modest hardware and the result is crackle, so new voices are
// dropped instead. Sized from measurement: heavy play peaks around 24, and a
// scheduled-but-not-yet-sounding burst holds its slot for the whole delay, so
// the ceiling sits above the observed peak to avoid swallowing scoring blips.
const MAX_VOICES = 40;
let auVoices = 0;
let auDropped = 0;

function initAudio() {
  if (auCtx || auBroken) return auCtx;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { auBroken = true; return null; }
    auCtx = new AC();

    auLimiter = auCtx.createDynamicsCompressor();
    auLimiter.threshold.value = -3;
    auLimiter.knee.value = 0;
    auLimiter.ratio.value = 20;
    auLimiter.attack.value = 0.002;
    auLimiter.release.value = 0.18;
    auLimiter.connect(auCtx.destination);

    auMaster = auCtx.createGain();
    auMaster.gain.value = 0.9;
    auMaster.connect(auLimiter);

    auSpinBus = auCtx.createGain();
    auSpinBus.gain.value = 1;
    auSpinBus.connect(auMaster);

    // Two seconds of white noise. Bursts read from a random offset into this,
    // so repeated percussive sounds are never the same waveform twice — playing
    // the identical slice over and over turns a rattle into a pitched buzz.
    const len = auCtx.sampleRate * 2;
    auNoiseBuf = auCtx.createBuffer(1, len, auCtx.sampleRate);
    const d = auNoiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) {
    auBroken = true;
  }
  return auCtx;
}

/** Safe to call from any interaction; browsers suspend contexts on their own. */
function resumeAudio() {
  initAudio();
  if (auCtx && auCtx.state === 'suspended') auCtx.resume().catch(() => {});
}

const auOn = () => auCtx && !auBroken && Settings.sfx && Settings.volume > 0;
const auVol = (g) => g * Settings.volume;
const auNow = () => auCtx.currentTime;

/**
 * Count a voice and tear it down when it finishes. Returns false if the mixer
 * is already full, in which case the caller should not build the nodes at all.
 */
function auTrack(source, gainNode, seconds) {
  auVoices++;
  let released = false;
  const release = () => {
    if (released) return;
    released = true;
    auVoices--;
    try { gainNode.disconnect(); } catch (e) { /* already torn down */ }
  };
  source.onended = release;
  // onended does not always fire (a suspended context, a dropped tab), so a
  // timer guarantees the voice is eventually given back.
  setTimeout(release, Math.max(80, seconds * 1000 + 400));
}

function auTone({ freq, to, type = 'triangle', dur = 0.12, gain = 0.2, delay = 0, attack = 0.005, bus = null }) {
  if (!auOn()) return;
  if (auVoices >= MAX_VOICES) { auDropped++; return; }
  if (!isFinite(freq) || freq <= 0) return;
  const t0 = auNow() + delay;
  const osc = auCtx.createOscillator();
  const g = auCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  if (to && to !== freq && isFinite(to)) {
    osc.frequency.exponentialRampToValueAtTime(Math.max(20, to), t0 + dur);
  }
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, auVol(gain)), t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g).connect(bus || auMaster);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
  auTrack(osc, g, delay + dur);
}

function auNoise({ dur = 0.1, freq = 1200, q = 1, gain = 0.2, delay = 0, to = null, type = 'bandpass', bus = null }) {
  if (!auOn()) return;
  if (auVoices >= MAX_VOICES) { auDropped++; return; }
  const t0 = auNow() + delay;
  const src = auCtx.createBufferSource();
  src.buffer = auNoiseBuf;
  src.loop = true;
  const f = auCtx.createBiquadFilter();
  f.type = type;
  f.frequency.setValueAtTime(freq, t0);
  if (to) f.frequency.exponentialRampToValueAtTime(Math.max(40, to), t0 + dur);
  f.Q.value = q;
  const g = auCtx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, auVol(gain)), t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f).connect(g).connect(bus || auMaster);
  // A random read offset keeps repeated bursts from being the same waveform.
  /* Read from a random point in the buffer, but never before the start of it.
     The spin rattle asks for 2.6s from a 2s buffer, which made this negative
     and threw a RangeError out of Sfx.spin — and out of doSpin with it, so the
     wheel never animated and the round hung on "the ball is still running".
     The source loops, so a request longer than the buffer simply wraps. */
  const maxOffset = Math.max(0, auNoiseBuf.duration - dur - 0.05);
  src.start(t0, Math.random() * maxOffset);
  src.stop(t0 + dur + 0.02);
  auTrack(src, g, delay + dur);
}

// ---------------------------------------------------------------------------
// the kit
// ---------------------------------------------------------------------------

let auStep = 0;
/** Reset the rising-pitch ladder used while a score is being tallied. */
function resetPitch() { auStep = 0; }

const MAJOR = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24];
const MAX_EXTRA_SEMIS = 12;

/**
 * Pitch for the nth scoring trigger. The ladder climbs the scale and then
 * stops climbing: an unbounded one walks straight past the top of hearing and
 * aliases into noise on a long reveal.
 */
function triggerFreq(step, kind) {
  const base = (kind === 'mult' || kind === 'xmult') ? 330 : 262;
  const i = Math.min(Math.max(0, step), MAJOR.length - 1);
  const extra = Math.min(Math.max(0, step - (MAJOR.length - 1)), MAX_EXTRA_SEMIS);
  return base * Math.pow(2, (MAJOR[i] + extra) / 12);
}

const Sfx = {
  ui:      () => auTone({ freq: 520, type: 'square', dur: 0.04, gain: 0.06 }),
  chip:    () => { auTone({ freq: 900, to: 700, type: 'triangle', dur: 0.06, gain: 0.13 }); auNoise({ dur: 0.05, freq: 2600, q: 2, gain: 0.07 }); },
  unchip:  () => auTone({ freq: 420, to: 300, type: 'triangle', dur: 0.06, gain: 0.1 }),
  deny:    () => auTone({ freq: 180, to: 120, type: 'sawtooth', dur: 0.14, gain: 0.09 }),

  // The ball: a band of noise sweeping down as it loses speed, with the rattle
  // of pockets going past. Routed through its own bus so a skipped spin can
  // cut it rather than leaving the ball rattling after it has landed.
  spin: (seconds = 2.2) => {
    if (!auOn()) return;
    // Clamp to something the buffer and the voice budget can actually serve.
    seconds = Math.max(0.2, Math.min(8, seconds));
    auSpinBus.gain.cancelScheduledValues(auNow());
    auSpinBus.gain.setValueAtTime(1, auNow());
    auNoise({ dur: seconds, freq: 2400, to: 380, q: 6, gain: 0.13, bus: auSpinBus });
    // Scale the rattle with the spin, and keep it well inside the voice budget.
    const ticks = Math.max(5, Math.min(14, Math.round(seconds * 6)));
    for (let i = 0; i < ticks; i++) {
      const p = i / ticks;
      auNoise({
        dur: 0.022, freq: 3000 - 1200 * p, q: 8, gain: 0.05, bus: auSpinBus,
        delay: seconds * (p * p * 0.85 + p * 0.15)
      });
    }
  },
  /** Cut the ball rattle: the spin ended early. */
  stopSpin: () => {
    if (!auCtx || !auSpinBus) return;
    const t = auNow();
    auSpinBus.gain.cancelScheduledValues(t);
    auSpinBus.gain.setValueAtTime(auSpinBus.gain.value, t);
    auSpinBus.gain.linearRampToValueAtTime(0.0001, t + 0.06);
  },

  land: () => {
    auTone({ freq: 260, to: 90, type: 'sine', dur: 0.22, gain: 0.28 });
    auNoise({ dur: 0.09, freq: 900, q: 1, gain: 0.14 });
  },
  nudge: () => { auTone({ freq: 700, to: 980, type: 'square', dur: 0.05, gain: 0.1 }); auNoise({ dur: 0.04, freq: 3200, q: 3, gain: 0.06 }); },

  /** One scoring trigger. Each successive call climbs the scale, as in Balatro. */
  trigger: (kind) => {
    const freq = triggerFreq(auStep, kind);
    auStep++;
    auTone({ freq, type: kind === 'xmult' ? 'sawtooth' : 'triangle', dur: kind === 'xmult' ? 0.2 : 0.11, gain: kind === 'xmult' ? 0.16 : 0.12 });
    if (kind === 'xmult') auTone({ freq: freq * 1.5, type: 'triangle', dur: 0.18, gain: 0.07, delay: 0.03 });
  },
  tick: () => auTone({ freq: 1500, type: 'square', dur: 0.015, gain: 0.03 }),

  slam: (power = 1) => {
    auTone({ freq: 150 * (1 + power * 0.3), to: 50, type: 'sine', dur: 0.4, gain: 0.32 });
    auNoise({ dur: 0.25, freq: 700, to: 120, q: 1, gain: 0.16 });
  },
  coin:  () => { auTone({ freq: 1180, type: 'square', dur: 0.05, gain: 0.09 }); auTone({ freq: 1760, type: 'square', dur: 0.08, gain: 0.08, delay: 0.05 }); },
  buy:   () => { Sfx.coin(); auNoise({ dur: 0.07, freq: 2000, q: 2, gain: 0.07 }); },
  pack:  () => { auNoise({ dur: 0.3, freq: 500, to: 3000, q: 0.7, gain: 0.16 }); auTone({ freq: 400, to: 900, type: 'triangle', dur: 0.25, gain: 0.1 }); },

  win: () => [0, 4, 7, 12].forEach((s, i) =>
    auTone({ freq: 392 * Math.pow(2, s / 12), type: 'triangle', dur: 0.5, gain: 0.16, delay: i * 0.075 })),
  lose: () => [0, -3, -7, -12].forEach((s, i) =>
    auTone({ freq: 330 * Math.pow(2, s / 12), type: 'sawtooth', dur: 0.6, gain: 0.13, delay: i * 0.12 })),
  boss: () => {
    auTone({ freq: 110, to: 82, type: 'sawtooth', dur: 1.1, gain: 0.14 });
    auTone({ freq: 111.5, to: 83, type: 'sawtooth', dur: 1.1, gain: 0.12, delay: 0.02 });
    auNoise({ dur: 1.0, freq: 220, to: 90, q: 2, gain: 0.08 });
  },
  unlock: () => [0, 7, 12, 16, 19].forEach((s, i) =>
    auTone({ freq: 523 * Math.pow(2, s / 12), type: 'triangle', dur: 0.4, gain: 0.12, delay: i * 0.06 }))
};

/** Diagnostics, used by the test page and worth keeping honest. */
const audioStats = () => ({ voices: auVoices, peakMax: MAX_VOICES, dropped: auDropped, state: auCtx && auCtx.state });

// ===== src/fx.js ========================================================

// Visual feedback. Everything here draws into a fixed overlay that the normal
// render pass never touches, so a full re-render cannot interrupt an animation
// in flight.



const fxLayer = () => document.getElementById('fx');

const fxWait = (t) => new Promise((r) => setTimeout(r, ms(t)));

function fxRect(el) {
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height, top: r.top };
}

/** A number that rises off the thing that produced it and fades. */
function fxFloat(el, text, kind = 'chips') {
  const layer = fxLayer();
  if (!el || !layer) return;
  const { x, top } = fxRect(el);
  const node = document.createElement('div');
  node.className = 'fx-float fx-' + kind;
  node.textContent = text;
  layer.append(node);
  node.style.left = x + 'px';
  node.style.top = top - 6 + 'px';
  if (Settings.reducedMotion) {
    setTimeout(() => node.remove(), 600);
    return;
  }
  const dur = ms(900);
  node.animate(
    [
      { transform: 'translate(-50%, 0) scale(.7)', opacity: 0 },
      { transform: 'translate(-50%, -14px) scale(1.15)', opacity: 1, offset: 0.18 },
      { transform: 'translate(-50%, -30px) scale(1)', opacity: 1, offset: 0.6 },
      { transform: 'translate(-50%, -52px) scale(.9)', opacity: 0 }
    ],
    { duration: Math.max(1, dur), easing: 'cubic-bezier(.2,.8,.3,1)' }
  ).onfinish = () => node.remove();
}

/** Briefly light up the element that just scored. */
function fxFlash(el, kind = 'hit') {
  if (!el) return;
  const cls = 'fx-lit-' + kind;
  el.classList.remove(cls);
  void el.offsetWidth;              // restart the CSS animation
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), ms(650) || 300);
}

/** Physical jolt, strength 0..1. */
function fxShake(power = 0.5) {
  if (!Settings.shake || Settings.reducedMotion) return;
  const app = document.getElementById('app');
  if (!app) return;
  const px = 3 + power * 16;
  const dur = ms(120 + power * 260);
  if (!dur) return;
  app.animate(
    [
      { transform: 'translate(0,0)' },
      { transform: `translate(${px}px, ${-px * 0.6}px)` },
      { transform: `translate(${-px * 0.8}px, ${px * 0.5}px)` },
      { transform: `translate(${px * 0.5}px, ${px * 0.3}px)` },
      { transform: `translate(${-px * 0.3}px, ${-px * 0.2}px)` },
      { transform: 'translate(0,0)' }
    ],
    { duration: dur, easing: 'ease-out' }
  );
}

/** Tween a number in place. Returns a promise that settles when it lands. */
function fxCountUp(el, from, to, duration, format = (n) => String(Math.round(n))) {
  if (!el) return Promise.resolve();
  const dur = ms(duration);
  if (!dur || from === to) { el.textContent = format(to); return Promise.resolve(); }
  return new Promise((resolve) => {
    const t0 = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - t0) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = format(from + (to - from) * eased);
      if (p < 1) requestAnimationFrame(tick);
      else { el.textContent = format(to); resolve(); }
    };
    requestAnimationFrame(tick);
  });
}

/** A quick scale pop, for a counter that just changed. */
function fxPop(el, scale = 1.25) {
  if (!el || Settings.reducedMotion) return;
  const dur = ms(260);
  if (!dur) return;
  el.animate(
    [{ transform: 'scale(1)' }, { transform: `scale(${scale})`, offset: 0.35 }, { transform: 'scale(1)' }],
    { duration: dur, easing: 'cubic-bezier(.3,1.4,.4,1)' }
  );
}

/** Celebratory specks, used when a table falls. */
function fxBurst(el, count = 18) {
  const layer = fxLayer();
  if (!el || !layer || Settings.reducedMotion) return;
  const { x, y } = fxRect(el);
  const colours = ['#d9b45b', '#f0d089', '#e0574a', '#4b8bd6', '#2ea36a'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'fx-spark';
    p.style.background = colours[i % colours.length];
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    layer.append(p);
    const a = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const dist = 60 + Math.random() * 140;
    p.animate(
      [
        { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
        { transform: `translate(${Math.cos(a) * dist - 50}%, ${Math.sin(a) * dist + 60}%) scale(.3)`, opacity: 0 }
      ],
      { duration: ms(700 + Math.random() * 500), easing: 'cubic-bezier(.1,.7,.3,1)' }
    ).onfinish = () => p.remove();
  }
}

function fxClear() {
  const layer = fxLayer();
  if (layer) layer.replaceChildren();
}

// ===== src/wheelview.js =================================================

// The wheel, as a live object rather than a picture.
//
// This owns one persistent <svg> and drives it from a requestAnimationFrame
// loop. `ui.render()` rebuilds the rest of the screen on every state change,
// which would destroy an animation in flight, so the element is cached and only
// rebuilt when the wheel's *shape* changes — a pocket excised, echoed,
// recoloured or enhanced.
//
// The geometry convention: angle 0 is 12 o'clock, positive is clockwise, and a
// spin finishes with the winning pocket under the pointer at the top. The ball
// travels the opposite way to the wheel, as a real one does.




const WHEEL_GEOM = {
  cx: 100, cy: 100,
  rHub: 50,        // inner edge of the pocket ring
  rRim: 92,        // outer edge of the pocket ring
  rBallTrack: 87,  // where the ball rides while it still has speed
  rBallRest: 71    // where it sits once it drops into a pocket
};

const IDLE_DEG_PER_SEC = -7;   // the croupier never quite stops the wheel

const mod360 = (a) => ((a % 360) + 360) % 360;
const wvLerp = (a, b, t) => a + (b - a) * t;
const wvSmooth = (t) => t * t * (3 - 2 * t);
const wvClamp01 = (t) => (t < 0 ? 0 : t > 1 ? 1 : t);

// ---------------------------------------------------------------------------
// pure motion maths — unit tested in test/run.mjs
// ---------------------------------------------------------------------------

/**
 * Where the wheel and ball must start and end for `pocketIndex` to finish under
 * the pointer. The wheel always travels backwards (anticlockwise) through at
 * least `wheelTurns` so it never visibly rewinds between spins.
 */
function spinPlan(fromWheel, pocketIndex, pocketCount, opts = {}) {
  const seg = 360 / pocketCount;
  const wheelTurns = opts.wheelTurns === undefined ? 3 : opts.wheelTurns;
  const ballTurns = opts.ballTurns === undefined ? 5 : opts.ballTurns;

  let wheelTo = -pocketIndex * seg;
  while (wheelTo > fromWheel - 360 * wheelTurns) wheelTo -= 360;

  return {
    seg,
    wheelFrom: fromWheel,
    wheelTo,
    // The ball runs clockwise: it starts behind and sweeps forward to the top.
    ballFrom: -360 * ballTurns,
    ballTo: 0
  };
}

/** Ball distance from the hub over the course of a spin, 0..1. */
function ballRadius(p, track = WHEEL_GEOM.rBallTrack, rest = WHEEL_GEOM.rBallRest) {
  if (p <= 0.5) return track;
  if (p < 0.82) return wvLerp(track, rest, wvSmooth((p - 0.5) / 0.32));
  // Dropping in: a few decaying bounces off the frets.
  const q = (p - 0.82) / 0.18;
  const decay = Math.max(0, 1 - q);
  return rest + Math.abs(Math.sin(q * Math.PI * 3)) * 6 * decay * decay;
}

/** Sideways rattle as the ball is captured, in degrees. Zero once settled. */
function ballRattle(p, seg) {
  if (p < 0.82) return 0;
  const q = (p - 0.82) / 0.18;
  const decay = Math.max(0, 1 - q);
  return Math.sin(q * Math.PI * 5) * seg * 0.5 * decay * decay;
}

const wvEaseWheel = (p) => 1 - Math.pow(1 - p, 3);
const wvEaseBall = (p) => 1 - Math.pow(1 - p, 2.1);

// ---------------------------------------------------------------------------
// live state
// ---------------------------------------------------------------------------

let wvSvg = null;
let wvRotor = null;
let wvBall = null;
let wvSig = '';
let wvCount = 37;
let wvPocket = 0;
let wvWheelAngle = 0;
let wvBallAngle = 0;
let wvBallR = WHEEL_GEOM.rBallRest;
let wvAnim = null;      // { kind, t0, dur, plan, resolve, guard }
let wvRaf = 0;
let wvLast = 0;
let wvIdle = false;
let wvArmed = false;    // a spin is about to start; do not snap the ball

const wheelIsBusy = () => !!wvAnim;

/** Called just before the engine resolves a spin, so the mount does not snap. */
function wheelArm() { wvArmed = true; }
function wheelDisarm() { wvArmed = false; }

function svgEl(tag, attrs, ...kids) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
  for (const kid of kids.flat()) if (kid) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}

const wvSignature = (wheel) =>
  wheel.length + '|' + wheel.map((p) => `${p.n}${p.colour[0]}${p.enh || ''}`).join(',');

function wvBuild(wheel) {
  const n = wheel.length;
  const seg = 360 / n;
  const { cx, cy, rHub, rRim } = WHEEL_GEOM;
  const rotor = [];

  for (let i = 0; i < n; i++) {
    const p = wheel[i];
    const a0 = (i * seg - seg / 2 - 90) * Math.PI / 180;
    const a1 = (i * seg + seg / 2 - 90) * Math.PI / 180;
    const pt = (r, a) => `${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`;
    const d = `M ${pt(rHub, a0)} L ${pt(rRim, a0)} A ${rRim} ${rRim} 0 0 1 ${pt(rRim, a1)} L ${pt(rHub, a1)} A ${rHub} ${rHub} 0 0 0 ${pt(rHub, a0)} Z`;
    const fill = p.colour === 'red' ? 'var(--red)' : p.colour === 'green' ? 'var(--green)' : '#23262c';
    rotor.push(svgEl('path', { d, fill, stroke: '#0b0d10', 'stroke-width': '.6' }));

    const am = (i * seg - 90) * Math.PI / 180;
    const tx = cx + 71 * Math.cos(am), ty = cy + 71 * Math.sin(am);
    rotor.push(svgEl('text', {
      x: tx.toFixed(2), y: ty.toFixed(2), fill: '#f0ece0',
      'font-size': n > 44 ? '6' : '8', 'text-anchor': 'middle', 'dominant-baseline': 'central',
      transform: `rotate(${i * seg} ${tx.toFixed(2)} ${ty.toFixed(2)})`
    }, String(p.n)));

    if (p.enh) {
      rotor.push(svgEl('text', {
        x: (cx + 57 * Math.cos(am)).toFixed(2), y: (cy + 57 * Math.sin(am)).toFixed(2),
        fill: '#f0d089', 'font-size': '7', 'text-anchor': 'middle', 'dominant-baseline': 'central'
      }, ENHANCEMENTS[p.enh].glyph));
    }
  }

  wvRotor = svgEl('g', { id: 'wheelRotor' }, ...rotor);
  wvBall = svgEl('g', { class: 'wheel-ball' },
    svgEl('circle', { r: 5.4, fill: '#fffaf0', stroke: '#8a6f26', 'stroke-width': '.8' }),
    svgEl('circle', { cx: -1.6, cy: -1.8, r: 1.7, fill: '#ffffff', opacity: '.85' }));

  wvSvg = svgEl('svg', { viewBox: '0 0 200 200', class: 'wheel-svg' },
    svgEl('circle', { cx, cy, r: 96, fill: '#1a1d22', stroke: '#b8973f', 'stroke-width': '3' }),
    wvRotor,
    // the track the ball rides before it drops
    svgEl('circle', { cx, cy, r: WHEEL_GEOM.rBallTrack, fill: 'none', stroke: 'rgba(255,255,255,.07)', 'stroke-width': '3.5' }),
    svgEl('circle', { cx, cy, r: 46, fill: '#12332a', stroke: '#b8973f', 'stroke-width': '2' }),
    svgEl('circle', { cx, cy, r: 20, fill: '#0d1015', stroke: '#8a6f26', 'stroke-width': '1.5' }),
    svgEl('path', { d: 'M 100 2 L 106 16 L 94 16 Z', fill: '#f0d089' }),
    wvBall);
  return wvSvg;
}

function wvApply() {
  if (!wvRotor) return;
  wvRotor.style.transform = `rotate(${wvWheelAngle.toFixed(2)}deg)`;
  const a = (wvBallAngle - 90) * Math.PI / 180;
  const x = WHEEL_GEOM.cx + wvBallR * Math.cos(a);
  const y = WHEEL_GEOM.cy + wvBallR * Math.sin(a);
  wvBall.setAttribute('transform', `translate(${x.toFixed(2)} ${y.toFixed(2)})`);
}

function wvStart() {
  // Must not touch wvLast: the loop reschedules itself through here every
  // frame, and resetting the timestamp would leave dt permanently at zero.
  if (!wvRaf && typeof requestAnimationFrame === 'function') {
    wvRaf = requestAnimationFrame(wvTick);
  }
}

function wvStop() {
  if (wvRaf) cancelAnimationFrame(wvRaf);
  wvRaf = 0;
  wvLast = 0;   // a cold restart should not see the whole pause as one frame
}

function wvFinishAnim() {
  const a = wvAnim;
  wvAnim = null;
  if (!a) return;
  clearTimeout(a.guard);
  wvWheelAngle = a.plan.wheelTo;
  wvBallAngle = a.plan.ballTo;
  wvBallR = WHEEL_GEOM.rBallRest;
  wvApply();
  if (a.resolve) a.resolve();
}

function wvTick(now) {
  wvRaf = 0;
  if (!wvSvg || !wvSvg.isConnected) return;   // detached; mountWheel restarts us
  const dt = wvLast ? Math.min(0.05, (now - wvLast) / 1000) : 0;
  wvLast = now;

  if (wvAnim) {
    const a = wvAnim;
    const p = wvClamp01((now - a.t0) / a.dur);
    if (a.kind === 'spin') {
      wvWheelAngle = wvLerp(a.plan.wheelFrom, a.plan.wheelTo, wvEaseWheel(p));
      wvBallAngle = wvLerp(a.plan.ballFrom, a.plan.ballTo, wvEaseBall(p)) + ballRattle(p, a.plan.seg);
      wvBallR = ballRadius(p);
    } else {
      // A nudge: the ball lifts, the wheel turns one pocket beneath it, the
      // ball drops back onto the pointer.
      const e = wvSmooth(p);
      wvWheelAngle = wvLerp(a.plan.wheelFrom, a.plan.wheelTo, e);
      wvBallAngle = -a.dir * Math.sin(p * Math.PI) * a.plan.seg * 0.45;
      wvBallR = WHEEL_GEOM.rBallRest + Math.sin(p * Math.PI) * 9;
    }
    wvApply();
    if (p >= 1) { wvFinishAnim(); wvStart(); return; }
    wvStart();
    return;
  }

  if (wvIdle && !Settings.reducedMotion) {
    wvWheelAngle += IDLE_DEG_PER_SEC * dt;
    wvBallAngle = wvWheelAngle + wvPocket * (360 / wvCount);
    wvApply();
    wvStart();
    return;
  }

  // nothing to animate; the loop idles until something asks for it again
}

// ---------------------------------------------------------------------------
// public surface
// ---------------------------------------------------------------------------

/**
 * Returns the persistent <svg>, building it only when the wheel's shape has
 * changed. `restIndex` is where the ball belongs when nothing is animating.
 */
function mountWheel(wheel, opts = {}) {
  const sig = wvSignature(wheel);
  if (sig !== wvSig) {
    wvSig = sig;
    wvBuild(wheel);
  }
  wvCount = wheel.length;
  wvIdle = !!opts.idle;

  if (!wvAnim && !wvArmed && opts.restIndex !== null && opts.restIndex !== undefined) {
    if (opts.restIndex !== wvPocket) wheelSettle(opts.restIndex, wheel.length);
  }
  if (wvPocket >= wvCount) wvPocket = 0;

  wvApply();
  wvStart();
  return wvSvg;
}

/** Snap straight to the finished position, with no animation. */
function wheelSettle(pocketIndex, pocketCount) {
  wvCount = pocketCount || wvCount;
  wvPocket = pocketIndex;
  wvWheelAngle = -pocketIndex * (360 / wvCount);
  wvBallAngle = 0;
  wvBallR = WHEEL_GEOM.rBallRest;
  wvArmed = false;
  if (wvAnim) { const a = wvAnim; wvAnim = null; clearTimeout(a.guard); if (a.resolve) a.resolve(); }
  wvApply();
}

/** Duration a full spin will take, so the caller can match the sound to it. */
const spinDuration = () => ms(2600);

function wheelSpinTo(pocketIndex, pocketCount) {
  wvArmed = false;
  wvIdle = false;
  wvCount = pocketCount;
  wvPocket = pocketIndex;
  const dur = spinDuration();
  if (!dur) { wheelSettle(pocketIndex, pocketCount); return Promise.resolve(); }

  const plan = spinPlan(wvWheelAngle, pocketIndex, pocketCount);
  return new Promise((resolve) => {
    wvAnim = { kind: 'spin', t0: performance.now(), dur, plan, resolve, guard: 0 };
    // A backgrounded tab stops firing rAF, which would leave this promise —
    // and the score reveal waiting on it — hanging forever.
    wvAnim.guard = setTimeout(() => { if (wvAnim) wvFinishAnim(); }, dur + 1500);
    wvStart();
  });
}

function wheelHopTo(pocketIndex, pocketCount) {
  wvArmed = false;
  wvIdle = false;
  wvCount = pocketCount;
  const prev = wvPocket;
  wvPocket = pocketIndex;
  const dur = ms(380);
  if (!dur) { wheelSettle(pocketIndex, pocketCount); return Promise.resolve(); }

  const seg = 360 / pocketCount;
  // Take the short way round so a one-pocket nudge is not a full revolution.
  let to = -pocketIndex * seg;
  while (to - wvWheelAngle > 180) to -= 360;
  while (to - wvWheelAngle < -180) to += 360;

  const plan = { seg, wheelFrom: wvWheelAngle, wheelTo: to, ballFrom: wvBallAngle, ballTo: 0 };
  const dir = Math.sign(to - wvWheelAngle) || (pocketIndex > prev ? 1 : -1) || 1;
  return new Promise((resolve) => {
    wvAnim = { kind: 'hop', t0: performance.now(), dur, plan, dir, resolve, guard: 0 };
    wvAnim.guard = setTimeout(() => { if (wvAnim) wvFinishAnim(); }, dur + 1200);
    wvStart();
  });
}

/** Land the ball right now. Returns true if it actually interrupted something. */
function wheelFinishNow() {
  if (!wvAnim) return false;
  wvFinishAnim();
  return true;
}

function wheelReset() {
  wvStop();
  if (wvAnim) { const a = wvAnim; wvAnim = null; clearTimeout(a.guard); if (a.resolve) a.resolve(); }
  wvSig = '';
  wvSvg = wvRotor = wvBall = null;
  wvWheelAngle = 0; wvBallAngle = 0; wvBallR = WHEEL_GEOM.rBallRest;
  wvPocket = 0; wvIdle = false; wvArmed = false;
}

if (typeof document !== 'undefined') {
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) wvStop();
    else wvStart();
  });
}

// ===== src/engine.js ====================================================

// Game state, scoring pipeline and run flow.
//
// Nothing in this file touches the DOM. The whole game is drivable headlessly,
// which is how it gets tested and balanced.














const BASE_SPINS = 4;
const BASE_CHIPS = 6;
const BASE_NUDGES = 3;
const FINAL_ANTE = 8;
const FULL_WHEEL = 37;

const SAVE_KEY = 'no-limit-save-v2';

const round2 = (n) => Math.round(n * 100) / 100;

/* Permanent unlocks bought with Markers in the arcade's progression menu.
   Read live rather than copied into the run, so buying one applies to the
   run in progress as well as the next. Zero when the arcade layer is absent,
   which is how the engine stays runnable headlessly in the test suite. */
function metaBonus(key) {
  const a = typeof globalThis !== 'undefined' ? globalThis.Arcade : null;
  return (a && a.progress) ? a.progress.bonus('nolimit', key) : 0;
}

function fmt(n) {
  if (n === undefined || n === null) return '0';
  if (!isFinite(n)) return '∞';
  if (Math.abs(n) >= 1e15) return n.toExponential(2).replace('e+', 'e');
  if (Number.isInteger(n)) return n.toLocaleString('en-US');
  return round2(n).toLocaleString('en-US');
}

// ---------------------------------------------------------------------------
// Scoring context
// ---------------------------------------------------------------------------

class Ctx {
  constructor(G, pocketIndex) {
    this.G = G;
    this.state = G;
    this.pocketIndex = pocketIndex;
    this.pocket = G.wheel[pocketIndex];
    this.result = this.pocket.n;
    this.colour = this.pocket.colour;
    this.spinNumber = G.round.spinNumber;
    this.spinsLeft = G.round.spinsLeft;
    this.bets = Object.entries(G.round.bets).map(([id, w]) => ({ spotId: id, wager: w, spot: SPOTS[id] }));
    this.chipsPlaced = this.bets.reduce((s, b) => s + b.wager, 0);
    this.spotsUsed = this.bets.length;
    this.nudges = G.round.nudgesThisSpin || 0;
    this.winners = [];
    this.chips = 0;
    this.mult = 1;
    this.money = 0;
    this.steps = [];
    this.effects = [];
    this.neighbours = false;
    this.rollIdx = 0;
    this.flags = G.round.bossFlags || {};
    this.cur = '';
    this.curTarget = null;

    const covered = new Set();
    for (const b of this.bets) for (const n of b.spot.numbers) covered.add(n);
    this.numbersCovered = covered.size;
  }

  roll() {
    const r = this.G.round.rolls;
    const v = r[this.rollIdx % r.length];
    this.rollIdx++;
    return v;
  }

  push(kind, text) {
    this.steps.push({
      src: this.cur, target: this.curTarget, text, kind,
      chips: this.chips, mult: this.mult
    });
  }

  note(src, text, kind = 'info') { const s = this.cur; this.cur = src; this.push(kind, text); this.cur = s; }
  addChips(n) { if (!n) return; this.chips += n; this.push('chips', `+${fmt(n)} Chips`); }
  addMult(n) { if (!n) return; this.mult += n; this.push('mult', `+${fmt(n)} Mult`); }
  xMult(x) { if (x === 1) return; this.mult = round2(this.mult * x); this.push('xmult', `x${round2(x)} Mult`); }
  addMoney(n) {
    if (!n || this.flags.noMoney) return;
    this.money += n;
    this.push('money', `+$${n}`);
  }

  countFamily(fam) { return this.winners.filter((w) => w.spot.family === fam && !w.dead).length; }
  chipsFromFamily(fam) { return this.winners.reduce((s, w) => s + (w.spot.family === fam ? w.chipsScored : 0), 0); }
  betOn(spotId) { return (this.G.round.bets[spotId] || 0) > 0; }
  enableNeighbours() { this.neighbours = true; }
  removeResultPocket() { this.effects.push({ type: 'removePocket', uid: this.pocket.uid }); }
  get won() { return this.score > 0; }
}

// ---------------------------------------------------------------------------
// Game
// ---------------------------------------------------------------------------

class Game {
  constructor() { this.listeners = []; }

  // -- lifecycle -----------------------------------------------------------

  static newRun(seed, opts = {}) {
    const G = new Game();
    G.seed = seed || randomSeed();
    G.rng = makeRng(G.seed);
    G.wheelId = opts.wheelId || 'house';
    G.stakeId = opts.stakeId || 'white';
    G.mods = { ...wheelMods(G.wheelId) };
    G.stake = stakeMods(G.stakeId);

    G.screen = 'blind';
    G.ante = 1;
    G.blindIndex = 0;
    G.money = G.mods.startMoney !== undefined ? G.mods.startMoney : 4;
    G.money += metaBonus('money');
    G.tokens = [];
    G.tokenSlots = 5 + (G.mods.tokenSlots || 0);
    G.omens = [];
    G.omenSlots = 2;
    G.charters = [];
    G.tags = [];
    G.wheel = freshWheel();
    G.bossesSeen = [];
    G.stats = { hits: {}, spins: 0, best: 0, roundsWon: 0, pocketsRemoved: 0, moneyEarned: 0, skips: 0 };
    G.messages = [];
    G.round = null;
    G.shop = null;
    G.shopFlags = {};
    G.pendingPack = null;
    G.pendingBoss = null;
    G.lastResult = null;
    G.lastColour = null;
    G.lastBets = null;
    G.endless = false;
    G.finished = false;
    G.rollBoss();

    const wheelDef = WHEELS_BY_ID[G.wheelId];
    if (wheelDef && wheelDef.setup) wheelDef.setup(G);
    return G;
  }

  on(fn) { this.listeners.push(fn); }
  emit() { for (const fn of this.listeners) fn(this); this.save(); }
  log(text) { this.messages.unshift(text); this.messages.length = Math.min(this.messages.length, 40); }

  // -- persistence ---------------------------------------------------------

  toJSON() {
    const { listeners, rng, round, ...rest } = this;
    // round.preview is a live scoring context holding a reference back to the
    // game, so it cannot be stringified. It is cheap to rebuild on load.
    const slimRound = round ? { ...round, preview: null } : null;
    return { ...rest, round: slimRound, rngState: this.rng.state() };
  }

  save() {
    if (this.finished) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.toJSON())); } catch (e) { /* no storage */ }
  }

  static clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* no storage */ } }

  static load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const data = JSON.parse(raw);
      const G = new Game();
      Object.assign(G, data);
      G.rng = makeRng(0);
      G.rng.setState(data.rngState);
      G.mods = G.mods || {};
      G.stake = G.stake || stakeMods(G.stakeId || 'white');
      G.shopFlags = G.shopFlags || {};
      G.tags = G.tags || [];
      if (G.round && G.round.phase === 'resolved') G.round.preview = computeSpin(G, G.round.pocketIndex);
      return G;
    } catch (e) { return null; }
  }

  // -- derived stats -------------------------------------------------------

  /** Sum a numeric passive across every live Token. */
  passive(key, base = 0) {
    let v = base;
    for (const tk of this.liveTokens()) {
      const p = tokenDef(tk).passive;
      if (p && p[key] !== undefined) v = typeof p[key] === 'number' ? v + p[key] : p[key];
    }
    return v;
  }

  hasPassive(key) {
    return this.liveTokens().some((tk) => (tokenDef(tk).passive || {})[key]);
  }

  hasCharter(id) { return this.charters.includes(id); }

  /** Tokens that still function: not debuffed by a dead Perishable sticker. */
  liveTokens() { return this.tokens.filter((tk) => !tk.dead); }

  /** Tokens that also survive the boss's interference, in scoring order. */
  activeTokens() {
    let list = this.liveTokens();
    if (this.round && this.round.bossFlags.disableLeftmost) list = list.slice(1);
    return list;
  }

  /**
   * How many Token cards are on the board — all of them, Negatives included.
   * A Negative pays for itself through `maxTokens` below; excluding it here as
   * well would hand out the slot twice.
   */
  tokenCount() { return this.tokens.length; }

  get spinsPerRound() {
    return Math.max(1, BASE_SPINS + this.passive('spins') + (this.mods.spins || 0)
      + (this.hasCharter('whale') ? 1 : 0));
  }

  get chipsPerRound() {
    return Math.max(1, BASE_CHIPS + this.passive('chips') + (this.mods.chips || 0)
      + (this.hasCharter('comped') ? 1 : 0) + metaBonus('chips'));
  }

  get nudgesPerRound() {
    return Math.max(0, BASE_NUDGES + this.passive('nudges') + (this.stake.nudges || 0)
      + (this.hasCharter('overtime') ? 2 : 0) + metaBonus('nudge'));
  }

  get nudgeStep() {
    return (this.hasCharter('fixer') || this.hasPassive('nudge2')) ? 2 : 1;
  }

  get noInterest() { return !!this.mods.noInterest || this.hasPassive('noInterest'); }

  get interestCap() {
    let cap = Math.max(5, this.passive('interestCap', 5));
    if (this.hasCharter('credit')) cap += 5;
    return cap;
  }

  /** Each Negative raises the cap by one and then fills that one itself. */
  get maxTokens() { return this.tokenSlots + (this.hasCharter('deeptable') ? 1 : 0) + this.negativeSlots(); }
  negativeSlots() { return this.tokens.filter((tk) => tk.edition === 'negative').length; }
  get maxOmens() { return this.omenSlots + (this.hasCharter('salon') ? 1 : 0); }

  get editionBoost() { return this.hasCharter('connoisseur') ? 4 : 1; }

  get pocketsMissing() { return Math.max(0, FULL_WHEEL - this.wheel.length); }

  gain(n, src) {
    if (!n) return;
    if (this.round && this.round.bossFlags.noMoney && n > 0) {
      this.log('The Drought swallows the money.');
      return;
    }
    this.money += n;
    if (n > 0) this.stats.moneyEarned += n;
    if (src) this.log(`${src}: ${n < 0 ? '-' : '+'}$${Math.abs(n)}`);
  }

  spend(n) { this.money -= n; }

  // -- wheel helpers -------------------------------------------------------

  removePocket(uid) {
    const i = this.wheel.findIndex((p) => p.uid === uid);
    if (i >= 0 && this.wheel.length > 6) {
      this.wheel.splice(i, 1);
      this.stats.pocketsRemoved++;
      return true;
    }
    return false;
  }

  clonePocket(pocket) {
    const i = this.wheel.findIndex((p) => p.uid === pocket.uid);
    const copy = makePocket(pocket.n, pocket.enh);
    copy.colour = pocket.colour;
    this.wheel.splice(i >= 0 ? i + 1 : this.wheel.length, 0, copy);
  }

  addPocketNumber(n) {
    const idx = this.wheel.findIndex((p) => p.n === n);
    this.wheel.splice(idx >= 0 ? idx + 1 : this.wheel.length, 0, makePocket(n));
  }

  enhanceRandomPocket(kind) {
    const plain = this.wheel.filter((p) => !p.enh);
    if (!plain.length) return null;
    const p = this.rng.pick(plain);
    p.enh = kind || this.rng.pick(Object.keys(ENHANCEMENTS));
    this.log(`Pocket ${p.n} becomes ${ENHANCEMENTS[p.enh].name}.`);
    return p;
  }

  // -- token helpers -------------------------------------------------------

  grantRandomToken(rarity) {
    if (this.tokenCount() >= this.maxTokens) return null;
    const owned = new Set(this.tokens.map((t) => t.id));
    let pool = TOKENS.filter((t) => !owned.has(t.id) && t.rarity !== 'legendary');
    if (rarity) pool = pool.filter((t) => t.rarity === rarity);
    if (!pool.length) return null;
    const d = this.rng.pick(pool);
    this.acquireToken(d.id);
    this.log(`Gained ${d.name}.`);
    return d.id;
  }

  grantRandomCharter() {
    const avail = CHARTERS.filter((c) => !this.charters.includes(c.id));
    if (!avail.length) return;
    const c = this.rng.pick(avail);
    this.charters.push(c.id);
    this.log(`Signed the ${c.name}.`);
  }

  acquireToken(id, opts = {}) {
    const tk = instantiate(id);
    if (opts.edition) tk.edition = opts.edition;
    if (opts.sticker) tk.sticker = opts.sticker;
    if (tk.sticker === 'rented') tk.sellValue = 0;
    if (tk.sticker === 'perishable') tk.life = 5;
    this.tokens.push(tk);
    discoverToken(id);
    const d = TOKENS_BY_ID[id];
    if (d.onAcquire) d.onAcquire(this);
    return tk;
  }

  canSellToken(i) {
    const tk = this.tokens[i];
    return !!tk && tk.sticker !== 'eternal';
  }

  sellToken(i) {
    if (!this.canSellToken(i)) return;
    const tk = this.tokens[i];
    this.gain(tk.sellValue);
    this.tokens.splice(i, 1);
    this.log(`Sold ${tokenDef(tk).name} for $${tk.sellValue}.`);
    this.emit();
  }

  destroyToken(tk) {
    if (tk.sticker === 'eternal') return false;
    const i = this.tokens.indexOf(tk);
    if (i >= 0) this.tokens.splice(i, 1);
    return true;
  }

  sellOmen(i) {
    const om = this.omens[i];
    if (!om) return;
    this.gain(Math.max(1, Math.floor(omenDef(om).cost / 2)));
    this.omens.splice(i, 1);
    this.emit();
  }

  moveToken(from, to) {
    if (to < 0 || to >= this.tokens.length || from === to) return;
    const [tk] = this.tokens.splice(from, 1);
    this.tokens.splice(to, 0, tk);
    this.emit();
  }

  // -- blind selection -----------------------------------------------------

  rollBoss() {
    this.pendingBoss = pickBoss(this.rng, this.ante, this.bossesSeen).id;
  }

  currentBlind() { return BLINDS[this.blindIndex]; }

  targetFor(blindIndex) {
    let t = anteTarget(this.ante, blindIndex);
    t = Math.round(t * Math.pow(this.stake.targetScale || 1, this.ante - 1));
    if (blindIndex === 2) {
      const boss = BOSSES_BY_ID[this.pendingBoss];
      if (boss && boss.targetMult) t = Math.round(t * boss.targetMult);
      const disc = this.passive('bossDiscount', 1);
      if (disc !== 1) t = Math.round(t * disc);
    }
    return t;
  }

  currentTarget() { return this.targetFor(this.blindIndex); }

  startBlind() {
    const blind = this.currentBlind();
    const boss = this.blindIndex === 2 ? BOSSES_BY_ID[this.pendingBoss] : null;
    const rd = {
      blindKey: blind.key,
      blindName: boss ? boss.name : blind.name,
      bossId: boss ? boss.id : null,
      bossFlags: boss && boss.flags ? { ...boss.flags } : {},
      target: this.currentTarget(),
      reward: this.stake.noSmallReward && blind.key === 'small' ? 0 : blind.reward,
      score: 0,
      spinsLeft: this.spinsPerRound,
      spinsTotal: this.spinsPerRound,
      nudgesLeft: this.nudgesPerRound,
      freeNudges: 0,
      nudgesThisSpin: 0,
      nudgesThisRound: 0,
      chipsTotal: this.chipsPerRound,
      bets: {},
      locked: [],
      phase: 'betting',
      spinNumber: 0,
      secondSight: 0,
      doubleNext: 0,
      pocketsAtStart: this.wheel.length,
      preview: null,
      candidates: null,
      rolls: []
    };
    if (boss && boss.setup) boss.setup(rd, this);

    // Tags queued for the start of a round.
    this.tags = this.tags.filter((tag) => {
      const d = tagDef(tag);
      if (d.when !== 'round') return true;
      d.apply(this, rd);
      this.log(`${d.name} fires.`);
      return false;
    });

    for (const tk of this.liveTokens()) {
      const d = tokenDef(tk);
      if (d.roundStart) d.roundStart(rd, this, tk);
    }

    // Rent is due whether or not the round goes well.
    for (const tk of this.tokens) {
      if (tk.sticker === 'rented') this.gain(-3, `Rent on ${tokenDef(tk).name}`);
    }

    this.round = rd;
    this.screen = 'play';
    this.emit();
  }

  skipBlind() {
    if (this.blindIndex === 2) return;
    this.stats.skips++;
    const count = this.hasCharter('silvertongue') ? 2 : 1;
    for (let i = 0; i < count; i++) this.takeTag(rollTag(this.rng));
    this.blindIndex++;
    if (this.screen !== 'pack') this.screen = 'blind';
    this.emit();
  }

  takeTag(tag) {
    const d = tagDef(tag);
    this.log(`Took the ${d.name}.`);
    if (d.when === 'now') {
      if (d.grantsPack) { this.openPack(d.grantsPack, true); return; }
      d.apply(this);
      return;
    }
    this.tags.push(tag);
  }

  // -- betting -------------------------------------------------------------

  chipsPlaced() { return Object.values(this.round.bets).reduce((s, w) => s + w, 0); }
  chipsLeft() { return this.round.chipsTotal - this.chipsPlaced(); }

  canPlace(spotId) {
    const rd = this.round;
    if (!rd || rd.phase !== 'betting') return false;
    if (rd.locked.includes(spotId)) return false;
    if (this.chipsLeft() <= 0) return false;
    const max = rd.bossFlags.maxPerSpot;
    if (max && (rd.bets[spotId] || 0) >= max) return false;
    return true;
  }

  placeChip(spotId) {
    if (!this.canPlace(spotId)) return false;
    this.round.bets[spotId] = (this.round.bets[spotId] || 0) + 1;
    this.emit();
    return true;
  }

  removeChip(spotId) {
    const rd = this.round;
    if (!rd || rd.phase !== 'betting' || !rd.bets[spotId]) return false;
    rd.bets[spotId]--;
    if (!rd.bets[spotId]) delete rd.bets[spotId];
    this.emit();
    return true;
  }

  clearBets() {
    if (this.round.phase !== 'betting') return;
    this.round.bets = {};
    this.emit();
  }

  // -- spinning ------------------------------------------------------------

  spin() {
    const rd = this.round;
    if (rd.phase !== 'betting' || !this.chipsPlaced()) return false;
    rd.spinNumber++;
    rd.nudgesThisSpin = 0;
    rd.rolls = Array.from({ length: 10 }, () => this.rng());

    if (rd.bossFlags.tithe) this.gain(-this.chipsPlaced(), 'The Tithe');

    const a = this.rng.int(this.wheel.length);
    const wantsTwo = rd.secondSight > 0 || this.hasPassive('doubleRoll') || rd.bossFlags.worstOfTwo;
    let b = a;
    if (wantsTwo && this.wheel.length > 1) { do { b = this.rng.int(this.wheel.length); } while (b === a); }

    if (rd.secondSight > 0 && wantsTwo) {
      rd.secondSight--;
      rd.candidates = [a, b];
      rd.phase = 'choosing';
      rd.preview = null;
    } else if (wantsTwo) {
      const sa = computeSpin(this, a).score;
      const sb = computeSpin(this, b).score;
      const keepA = rd.bossFlags.worstOfTwo ? sa <= sb : sa >= sb;
      this.setResult(keepA ? a : b);
    } else {
      this.setResult(a);
    }
    this.emit();
    return true;
  }

  setResult(pocketIndex) {
    const rd = this.round;
    rd.pocketIndex = pocketIndex;
    rd.phase = 'resolved';
    rd.candidates = null;
    rd.preview = computeSpin(this, pocketIndex);
  }

  chooseCandidate(pocketIndex) {
    if (this.round.phase !== 'choosing') return;
    this.setResult(pocketIndex);
    this.emit();
  }

  freeNudgeAvailable() {
    const rd = this.round;
    if (rd.freeNudges > 0) return true;
    return this.hasPassive('freeNudgePerSpin') && rd.nudgesThisSpin === 0;
  }

  canNudge() {
    const rd = this.round;
    if (!rd || rd.phase !== 'resolved' || rd.bossFlags.noNudge) return false;
    return this.freeNudgeAvailable() || rd.nudgesLeft > 0;
  }

  nudge(steps) {
    const rd = this.round;
    if (!this.canNudge()) return false;
    if (rd.freeNudges > 0) rd.freeNudges--;
    else if (this.hasPassive('freeNudgePerSpin') && rd.nudgesThisSpin === 0) { /* free */ }
    else rd.nudgesLeft--;
    rd.nudgesThisSpin++;
    rd.nudgesThisRound++;
    const n = this.wheel.length;
    rd.pocketIndex = ((rd.pocketIndex + steps) % n + n) % n;
    rd.preview = computeSpin(this, rd.pocketIndex);
    this.emit();
    return true;
  }

  collect() {
    const rd = this.round;
    if (rd.phase !== 'resolved') return;
    const ctx = rd.preview;

    let gained = ctx.score;
    if (rd.doubleNext > 0 && gained > 0) { gained *= 2; rd.doubleNext--; this.log('Doubling Down: the spin pays twice.'); }

    rd.score += gained;
    this.stats.spins++;
    this.stats.hits[ctx.result] = (this.stats.hits[ctx.result] || 0) + 1;
    this.stats.best = Math.max(this.stats.best, gained);

    for (const tk of this.activeTokens()) {
      const d = tokenDef(tk);
      if (d.spinEnd) { ctx.cur = d.name; d.spinEnd(ctx, tk); }
    }
    if (ctx.money) this.gain(ctx.money);

    for (const e of ctx.effects) {
      if (e.type === 'removePocket' || e.type === 'shatter') {
        if (e.type === 'shatter' && this.hasPassive('noShatter')) continue;
        const p = this.wheel.find((x) => x.uid === e.uid);
        if (this.removePocket(e.uid) && p) {
          this.log(e.type === 'shatter'
            ? `Glass pocket ${p.n} shatters out of the wheel.`
            : `Pocket ${p.n} is gone from the wheel.`);
        }
      }
    }

    if (rd.bossFlags.wheelbreak && this.wheel.length > 12) {
      const p = this.rng.pick(this.wheel);
      this.removePocket(p.uid);
      this.log(`The Wheelbreaker prises out pocket ${p.n}.`);
    }

    if (rd.bossFlags.lockHeaviest) {
      const entries = Object.entries(rd.bets).sort((x, y) => y[1] - x[1]);
      if (entries.length) {
        rd.locked.push(entries[0][0]);
        this.log(`The Serpent locks ${SPOTS[entries[0][0]].label}.`);
      }
    }

    this.lastResult = ctx.result;
    this.lastColour = ctx.colour;
    rd.spinsLeft--;
    rd.bets = {};
    rd.preview = null;
    rd.nudgesThisSpin = 0;
    rd.phase = 'betting';

    if (rd.score >= rd.target) this.winRound();
    else if (rd.spinsLeft <= 0) this.loseRound();
    this.emit();
  }

  // -- round resolution ----------------------------------------------------

  winRound() {
    const rd = this.round;
    this.stats.roundsWon++;
    const before = this.money;
    const spinsBonus = rd.spinsLeft;
    const interest = this.noInterest ? 0 : Math.min(Math.floor(Math.max(0, this.money) / 5), this.interestCap);
    this.money += rd.reward + spinsBonus + interest;
    this.stats.moneyEarned += rd.reward + spinsBonus + interest;

    for (const tk of this.liveTokens()) {
      const d = tokenDef(tk);
      if (d.roundEnd) d.roundEnd(this, tk);
    }
    if (this.hasCharter('tipster')) this.gain(2, 'Tipster');

    // Perishable Tokens age out.
    for (const tk of this.tokens) {
      if (tk.sticker === 'perishable' && !tk.dead) {
        tk.life = (tk.life || 5) - 1;
        if (tk.life <= 0) { tk.dead = true; this.log(`${tokenDef(tk).name} has perished.`); }
      }
    }

    if (rd.bossId) {
      this.tags = this.tags.filter((tag) => {
        const d = tagDef(tag);
        if (d.when !== 'boss') return true;
        d.apply(this);
        this.log(`${d.name} fires.`);
        return false;
      });
    }

    this.cashout = {
      blind: rd.blindName,
      reward: rd.reward,
      spinsBonus,
      interest,
      extra: this.money - before - rd.reward - spinsBonus - interest
    };
    rd.phase = 'won';
    this.screen = 'cashout';
  }

  loseRound() {
    this.round.phase = 'lost';
    this.screen = 'gameover';
    this.finishRun(false);
  }

  finishRun(won) {
    if (this.finished) return;
    this.finished = true;
    Game.clearSave();
    const summary = {
      seed: this.seed, wheel: this.wheelId, stake: this.stakeId,
      ante: this.ante, won, spins: this.stats.spins,
      bestScore: this.stats.best, money: this.stats.moneyEarned,
      tokens: this.tokens.map((t) => t.id)
    };
    this.unlocked = [];
    for (const id of wheelsEarnedBy(summary)) {
      if (unlockWheel(id)) this.unlocked.push({ kind: 'wheel', id });
    }
    if (won) {
      const nxt = nextStake(this.stakeId);
      if (nxt && unlockStake(nxt.id)) this.unlocked.push({ kind: 'stake', id: nxt.id });
    }
    recordRun(summary);

    // Post the run to the arcade. No Limit is ranked by best single spin, the
    // number the game already treats as its headline score. Fire-and-forget:
    // the engine stays DOM-free and never waits on the network.
    const arcade = typeof globalThis !== 'undefined' ? globalThis.Arcade : null;
    if (arcade) {
      arcade.progress.recordRun('nolimit', {
        score: summary.bestScore,
        ante: summary.ante,
        tables: this.stats.roundsWon,
        pocketsRemoved: this.stats.pocketsRemoved,
        won: !!won,
        // The stake is this game's difficulty ladder.
        difficulty: this.stakeId
      });
      arcade.submitScore('nolimit', {
        score: summary.bestScore,
        metrics: { ante: summary.ante, tables: this.stats.roundsWon },
        meta: {
          ante: summary.ante,
          won: !!won,
          wheel: summary.wheel,
          stake: summary.stake,
          spins: summary.spins,
          seed: summary.seed
        }
      });
    }
  }

  toShop() {
    this.buildShop();
    this.screen = 'shop';
    this.emit();
  }

  nextBlind() {
    const wasBoss = this.blindIndex === 2;
    this.round = null;
    this.shop = null;
    if (wasBoss) {
      this.bossesSeen.push(this.pendingBoss);
      if (this.ante >= FINAL_ANTE && !this.endless) {
        this.screen = 'win';
        this.finishRun(true);
        this.emit();
        return;
      }
      this.ante++;
      this.blindIndex = 0;
      this.rollBoss();
    } else {
      this.blindIndex++;
    }
    this.screen = 'blind';
    this.emit();
  }

  goEndless() {
    this.endless = true;
    this.finished = false;
    this.ante++;
    this.blindIndex = 0;
    this.rollBoss();
    this.screen = 'blind';
    this.emit();
  }

  // -- shop ----------------------------------------------------------------

  priceOf(base) {
    if (this.shopFlags.free) return 0;
    return Math.max(0, base - (this.hasCharter('discount') ? 1 : 0));
  }

  rerollCost() {
    if (this.shopFlags.freeRerolls) return 0;
    const c = 4 + (this.shop ? this.shop.rerolls : 0) - (this.hasCharter('houseedge') ? 3 : 0);
    return Math.max(1, c);
  }

  rollShopItem(force = {}) {
    const owned = new Set(this.tokens.map((t) => t.id));
    const r = this.rng();
    if (!force.token && r > 0.86) {
      const p = rollPackType(this.rng);
      return { kind: 'pack', id: p.id, price: this.priceOf(p.cost) };
    }
    if (force.token || r < 0.62) {
      const weights = force.rare
        ? { common: 0, uncommon: 0, rare: 100, legendary: 3 }
        : this.hasCharter('reserve')
          ? { common: 38, uncommon: 32, rare: 25, legendary: 5 }
          : { common: 60, uncommon: 27, rare: 11, legendary: 2 };
      const pool = TOKENS.filter((t) => !owned.has(t.id) && weights[t.rarity] > 0);
      if (pool.length) {
        const total = pool.reduce((s, t) => s + weights[t.rarity], 0);
        let pick = this.rng() * total;
        for (const t of pool) {
          pick -= weights[t.rarity];
          if (pick <= 0) {
            const edition = force.edition || rollEdition(this.rng, this.editionBoost);
            const sticker = rollSticker(this.rng, this.stake);
            return {
              kind: 'token', id: t.id, edition, sticker,
              price: Math.max(1, this.priceOf(t.cost + editionPrice(edition)) - (sticker === 'rented' ? 2 : 0))
            };
          }
        }
      }
    }
    const o = this.rng.pick(OMENS);
    return { kind: 'omen', id: o.id, price: this.priceOf(o.cost) };
  }

  buildShop() {
    // Tags queued for a shop fire before it is stocked, so they can change it.
    this.shopFlags = {};
    this.tags = this.tags.filter((tag) => {
      const d = tagDef(tag);
      if (d.when !== 'shop') return true;
      d.apply(this);
      this.log(`${d.name} fires.`);
      return false;
    });

    let slots = 3 + (this.hasCharter('marked') ? 1 : 0) + (this.mods.shopSlots || 0)
      + (this.hasCharter('ballroom') ? 1 : 0);
    slots = Math.max(2, slots);

    const items = [];
    if (this.shopFlags.forceRare) items.push(this.rollShopItem({ token: true, rare: true }));
    if (this.shopFlags.forceEdition) items.push(this.rollShopItem({ token: true, edition: this.shopFlags.forceEdition }));
    while (items.length < slots) items.push(this.rollShopItem());

    let charter = null;
    const avail = CHARTERS.filter((c) => !this.charters.includes(c.id));
    if ((this.blindIndex === 2 || this.shopFlags.forceCharter) && avail.length) {
      const c = this.rng.pick(avail);
      charter = { kind: 'charter', id: c.id, price: this.priceOf(c.cost) };
    }
    this.shop = { items, charter, rerolls: 0 };
  }

  reroll() {
    const cost = this.rerollCost();
    if (this.money < cost) return;
    this.spend(cost);
    this.shop.rerolls++;
    this.shop.items = this.shop.items.map(() => this.rollShopItem());
    this.emit();
  }

  canBuy(item) {
    if (!item || item.sold) return false;
    if (this.money < item.price) return false;
    if (item.kind === 'token') return this.tokenCount() < this.maxTokens || item.edition === 'negative';
    if (item.kind === 'omen') return this.omens.length < this.maxOmens;
    return true;
  }

  buy(item) {
    if (!this.canBuy(item)) return false;
    this.spend(item.price);
    item.sold = true;
    if (item.kind === 'token') {
      this.acquireToken(item.id, { edition: item.edition, sticker: item.sticker });
      this.log(`Bought ${TOKENS_BY_ID[item.id].name}.`);
    } else if (item.kind === 'omen') {
      this.omens.push(instantiateOmen(item.id));
      this.log(`Bought ${OMENS_BY_ID[item.id].name}.`);
    } else if (item.kind === 'charter') {
      this.charters.push(item.id);
      this.log(`Signed the ${CHARTERS_BY_ID[item.id].name}.`);
    } else if (item.kind === 'pack') {
      this.openPack(item.id, false);
    }
    this.emit();
    return true;
  }

  // -- booster packs -------------------------------------------------------

  openPack(packId, free) {
    const def = PACKS_BY_ID[packId];
    if (!def) return;
    const size = def.size + (this.hasCharter('bulkbuyer') ? 1 : 0);
    const owned = new Set(this.tokens.map((t) => t.id));
    const options = [];
    const enhKinds = Object.keys(ENHANCEMENTS);

    for (let i = 0; i < size; i++) {
      if (def.kind === 'token') {
        const pool = TOKENS.filter((t) => !owned.has(t.id) && !options.some((o) => o.id === t.id));
        if (!pool.length) break;
        const weights = { common: 55, uncommon: 30, rare: 13, legendary: 2 };
        const total = pool.reduce((s, t) => s + weights[t.rarity], 0);
        let pick = this.rng() * total;
        let chosen = pool[0];
        for (const t of pool) { pick -= weights[t.rarity]; if (pick <= 0) { chosen = t; break; } }
        options.push({ kind: 'token', id: chosen.id, edition: rollEdition(this.rng, this.editionBoost * 2) });
      } else if (def.kind === 'omen') {
        options.push({ kind: 'omen', id: this.rng.pick(OMENS).id });
      } else if (def.kind === 'enh') {
        options.push({ kind: 'enh', id: this.rng.pick(enhKinds) });
      } else {
        const pool = FATES.filter((f) => !options.some((o) => o.id === f.id));
        options.push({ kind: 'fate', id: this.rng.pick(pool.length ? pool : FATES).id });
      }
    }

    this.pendingPack = {
      packId, options, picksLeft: Math.min(def.picks, options.length),
      free: !!free, returnTo: this.screen
    };
    this.screen = 'pack';
    this.emit();
  }

  packPickable(opt) {
    const p = this.pendingPack;
    if (!p || p.picksLeft <= 0 || opt.taken) return false;
    if (opt.kind === 'token') return this.tokenCount() < this.maxTokens || opt.edition === 'negative';
    if (opt.kind === 'omen') return this.omens.length < this.maxOmens;
    return true;
  }

  /** For 'enh' options the caller supplies the pocket the player picked. */
  packPick(opt, target) {
    if (!this.packPickable(opt)) return false;
    if (opt.kind === 'enh' && !target) return false;
    if (opt.kind === 'token') this.acquireToken(opt.id, { edition: opt.edition });
    else if (opt.kind === 'omen') this.omens.push(instantiateOmen(opt.id));
    else if (opt.kind === 'enh') { target.enh = opt.id; this.log(`Pocket ${target.n} becomes ${ENHANCEMENTS[opt.id].name}.`); }
    else FATES_BY_ID[opt.id].use(this);
    opt.taken = true;
    this.pendingPack.picksLeft--;
    if (this.pendingPack.picksLeft <= 0) this.closePack();
    else this.emit();
    return true;
  }

  closePack() {
    const back = this.pendingPack ? this.pendingPack.returnTo : 'shop';
    this.pendingPack = null;
    this.screen = back === 'pack' ? 'shop' : back;
    this.emit();
  }

  // -- omens ---------------------------------------------------------------

  omenUsable(i) {
    const om = this.omens[i];
    if (!om) return false;
    const d = omenDef(om);
    if (d.roundOnly && !(this.round && this.round.phase === 'betting')) return false;
    if (!['shop', 'play', 'blind', 'cashout'].includes(this.screen)) return false;
    if (d.enabled && !d.enabled(this)) return false;
    return true;
  }

  useOmen(i, target) {
    if (!this.omenUsable(i)) return false;
    const d = omenDef(this.omens[i]);
    if (d.target !== 'none' && !target) return false;
    d.use(this, target);
    this.omens.splice(i, 1);
    if (this.round && this.round.phase === 'resolved') {
      this.round.preview = computeSpin(this, this.round.pocketIndex);
    }
    this.emit();
    return true;
  }
}

// ---------------------------------------------------------------------------
// The scoring pipeline
// ---------------------------------------------------------------------------

function applyEdition(ctx, tk) {
  const ed = tk.edition && EDITIONS[tk.edition];
  if (!ed) return;
  const label = ctx.cur;
  ctx.cur = `${ed.name} ${label}`;
  if (ed.chips) ctx.addChips(ed.chips);
  if (ed.mult) ctx.addMult(ed.mult);
  if (ed.xmult) ctx.xMult(ed.xmult);
  ctx.cur = label;
}

function runToken(ctx, tk, i, tokens) {
  const d = tokenDef(tk);
  ctx.cur = d.name;
  ctx.curTarget = { k: 'token', i: ctx.G.tokens.indexOf(tk) };

  if (d.isMirror || d.isMirrorLeft) {
    const other = tokens[i + (d.isMirror ? 1 : -1)];
    if (other && tokenDef(other).score) {
      ctx.cur = `${d.name} (${tokenDef(other).name})`;
      tokenDef(other).score(ctx, other);
    }
  } else if (d.score) {
    d.score(ctx, tk);
  }
  applyEdition(ctx, tk);
}

function computeSpin(G, pocketIndex) {
  const rd = G.round;
  const ctx = new Ctx(G, pocketIndex);
  const tokens = G.activeTokens();

  for (const tk of tokens) {
    const d = tokenDef(tk);
    if (d.resolve) d.resolve(ctx, tk);
  }

  // --- which bets won? ---
  const hitNumbers = new Map([[ctx.result, 1]]);
  if (ctx.neighbours) {
    const n = G.wheel.length;
    for (const off of [-1, 1]) {
      const p = G.wheel[(pocketIndex + off + n) % n];
      if (!hitNumbers.has(p.n)) hitNumbers.set(p.n, 0.5);
    }
  }
  for (const b of ctx.bets) {
    let best = 0;
    for (const [num, weight] of hitNumbers) if (b.spot.numbers.includes(num)) best = Math.max(best, weight);
    if (best > 0) ctx.winners.push({ ...b, weight: best, chipsScored: 0 });
  }

  // --- base chips and mult from the winning bets ---
  const deadFams = ctx.flags.deadFamilies || [];
  const deadColour = ctx.flags.deadColour;
  const deadSpin = ctx.flags.deadSpins && ctx.spinNumber <= ctx.flags.deadSpins;
  const chipBonus = G.mods.chipBonus || 1;

  for (const w of ctx.winners) {
    const blocked = deadFams.includes(w.spot.family) || deadColour === ctx.colour || deadSpin;
    let chips = Math.floor(w.spot.chips * w.wager * w.weight * chipBonus);
    let mult = Math.floor(w.spot.mult * w.weight * 10) / 10;
    if (blocked) { chips = 0; w.dead = true; }
    w.chipsScored = chips;
    ctx.chips += chips;
    ctx.mult += mult;
    ctx.cur = w.spot.label + (w.weight < 1 ? ' (neighbour)' : '');
    ctx.curTarget = { k: 'bet', id: w.spotId };
    ctx.push(blocked ? 'dead' : 'bet', blocked ? `blocked — +${mult} Mult only` : `+${fmt(chips)} Chips  +${mult} Mult`);
  }

  ctx.score = 0;
  if (!ctx.winners.length) {
    ctx.chips = 0;
    ctx.mult = 0;
    ctx.cur = 'No winning bets';
    ctx.curTarget = null;
    ctx.push('dead', 'the table takes it');
    return finishSpin(ctx);
  }

  // --- the result pocket's own enhancement ---
  const enh = ctx.flags.noEnhancements ? null : ctx.pocket.enh;
  if (enh) {
    ctx.curTarget = { k: 'pocket' };
    const times = G.hasPassive('retriggerEnh') ? 2 : 1;
    for (let t = 0; t < times; t++) applyEnhancement(ctx, enh);
  }

  // --- tokens, left to right ---
  const silenced = ctx.flags.noTokenSpins && ctx.spinNumber <= ctx.flags.noTokenSpins;
  if (!silenced) {
    const repeats = G.hasPassive('perpetual') && ctx.spinNumber % 4 === 0 ? 2 : 1;
    for (let pass = 0; pass < repeats; pass++) {
      for (let i = 0; i < tokens.length; i++) {
        runToken(ctx, tokens[i], i, tokens);
        if (i === 0 && G.hasPassive('retriggerFirst')) runToken(ctx, tokens[i], i, tokens);
      }
    }
  }

  for (const tk of tokens) {
    const d = tokenDef(tk);
    if (d.finalize) { ctx.cur = d.name; ctx.curTarget = { k: 'token', i: G.tokens.indexOf(tk) }; d.finalize(ctx, tk); }
  }

  return finishSpin(ctx);
}

function applyEnhancement(ctx, enh) {
  const e = ENHANCEMENTS[enh];
  ctx.cur = `${e.name} pocket`;
  if (enh === 'gilded') ctx.addChips(50);
  else if (enh === 'bonus') ctx.addChips(30);
  else if (enh === 'mult') ctx.addMult(4);
  else if (enh === 'steel') ctx.xMult(1.5);
  else if (enh === 'glass') {
    ctx.xMult(3);
    if (ctx.roll() < 0.25 && !ctx.G.hasPassive('noShatter')) {
      ctx.effects.push({ type: 'shatter', uid: ctx.pocket.uid });
      ctx.push('warn', 'will shatter');
    }
  } else if (enh === 'lucky') {
    if (ctx.roll() < 1 / 3) ctx.xMult(2); else ctx.push('dead', 'no luck');
    if (ctx.roll() < 1 / 6) ctx.addMoney(4);
  }
}

function finishSpin(ctx) {
  const f = ctx.flags;
  if (f.multPenalty) ctx.mult = Math.max(1, ctx.mult - f.multPenalty);
  if (f.multCap) ctx.mult = Math.min(ctx.mult, f.multCap);
  ctx.mult = Math.max(0, round2(ctx.mult));
  ctx.chips = Math.max(0, Math.floor(ctx.chips));
  ctx.score = Math.floor(ctx.chips * ctx.mult);
  return ctx;
}

const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------------------
// tiny DOM helper
// ---------------------------------------------------------------------------

// `tag` is emmet-ish: "div", "button.btn.sm", "div#readout.readout".
const TAG_RE = /^([a-z0-9-]*)(?:#([^.#]+))?((?:\.[^.#]+)*)$/i;

function h(tag, attrs, ...kids) {
  const m = TAG_RE.exec(tag);
  if (!m) throw new Error('bad tag: ' + tag);
  const el = document.createElement(m[1] || 'div');
  if (m[2]) el.id = m[2];
  if (m[3]) el.className = m[3].slice(1).split('.').join(' ');
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') el.className += (el.className ? ' ' : '') + v;
      else if (k === 'style') Object.assign(el.style, v);
      else if (k === 'html') el.innerHTML = v;
      else if (k === 'tip') tip(el, v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
      else el.setAttribute(k, v);
    }
  }
  for (const kid of kids.flat(3)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

// ---------------------------------------------------------------------------
// tooltips
// ---------------------------------------------------------------------------

function tip(el, data) {
  el.addEventListener('mouseenter', () => {
    const t = $('tooltip');
    t.replaceChildren();
    t.append(h('h4', null, data.title));
    if (data.rarity) t.append(h('div.rare', { style: { color: RARITY[data.rarity].colour } }, RARITY[data.rarity].name));
    if (data.sub) t.append(h('div.tsub', null, data.sub));
    if (data.body) t.append(h('div', { style: { marginTop: '5px' } }, data.body));
    for (const line of data.lines || []) {
      t.append(h('div.tline', { style: { color: line.colour || '#f0d089' } }, line.text));
    }
    if (data.foot) t.append(h('div.tfoot', null, data.foot));
    t.hidden = false;
    place(el);
  });
  el.addEventListener('mousemove', () => place(el));
  el.addEventListener('mouseleave', () => { $('tooltip').hidden = true; });

  function place(target) {
    const t = $('tooltip');
    const r = target.getBoundingClientRect();
    const tr = t.getBoundingClientRect();
    let top = r.top - tr.height - 10;
    if (top < 8) top = r.bottom + 10;
    t.style.left = Math.max(8, Math.min(r.left + r.width / 2 - tr.width / 2, window.innerWidth - tr.width - 8)) + 'px';
    t.style.top = Math.max(8, Math.min(top, window.innerHeight - tr.height - 8)) + 'px';
  }
}

function hideTip() { const t = $('tooltip'); if (t) t.hidden = true; }

/** The dealer, if the arcade layer is present. */
function dealer() {
  const a = typeof globalThis !== 'undefined' ? globalThis.Arcade : null;
  return a && a.dealer ? a.dealer : null;
}

/** The shared arcade buttons, for this game's own title and end screens. */
function arcadeRow() {
  const arcade = typeof globalThis !== 'undefined' ? globalThis.Arcade : null;
  return arcade && arcade.ui ? arcade.ui.inlineActions({ gameId: 'nolimit' }) : null;
}

let G = null;
let revealToken = 0;
let revealPending = false;          // ball in the air: the result is not the player's yet                 // bumped to cancel an in-flight reveal
let reveal = null;                   // { chips, mult, upto, done }
let hiddenShown = false;             // The Whisper: has the result been revealed?

function attach(game) {
  loadSettings();
  loadProfile();
  // Shared account + leaderboard layer: resolves who is signed in before the
  // title screen draws.
  const arcade = typeof globalThis !== 'undefined' ? globalThis.Arcade : null;
  if (arcade) {
    arcade.init({ gameId: 'nolimit' });
    arcade.ui.setSound({
      ui: () => Sfx.ui(), success: () => Sfx.coin(),
      deny: () => Sfx.deny(), achievement: () => Sfx.win()
    });
  }
  bindGame(game);
}

function bindGame(game) {
  G = game;
  if (G) {
    G.listeners = [];
    G.on(render);
  }
  wheelReset();
  revealToken++; reveal = null; revealPending = false; hiddenShown = false;
  fxClear();
  render();
}

// ---------------------------------------------------------------------------
// top level
// ---------------------------------------------------------------------------

function render() {
  const side = $('sidebar'), centre = $('centre');
  const tokenbar = $('tokenbar'), actionbar = $('actionbar');

  if (!G) {
    side.hidden = true;
    $('app').style.gridTemplateColumns = '1fr';
    tokenbar.hidden = true;
    actionbar.hidden = true;
    centre.replaceChildren(titleScreen());
    return;
  }

  side.hidden = false;
  $('app').style.gridTemplateColumns = '272px 1fr';
  tokenbar.hidden = false;
  side.replaceChildren(...sidebar());
  tokenbar.replaceChildren(...tokenBar());

  const view = {
    blind: blindSelect, play: playScreen, cashout: cashoutScreen, shop: shopScreen,
    pack: packScreen, gameover: gameOverScreen, win: winScreen
  }[G.screen];
  centre.replaceChildren(view ? view() : h('div'));

  const acts = actions();
  actionbar.hidden = !acts.length;
  actionbar.replaceChildren(...acts);

  if (G.screen === 'play') paintReadout();
}

function tokenBar() {
  const out = [h('div.bar-label', null, `Tokens ${G.tokenCount()}/${G.maxTokens}`)];
  const disabledLeft = G.round && G.round.bossFlags.disableLeftmost;

  G.tokens.forEach((tk, i) => {
    const d = tokenDef(tk);
    const ed = tk.edition && EDITIONS[tk.edition];
    const sk = tk.sticker && STICKERS[tk.sticker];
    const off = (disabledLeft && i === 0) || tk.dead;
    const lines = [];
    if (ed) lines.push({ text: `${ed.name}: ${ed.text}` });
    if (sk) lines.push({ text: `${sk.name}: ${sk.text}${tk.sticker === 'perishable' && tk.life ? ` (${tk.life} rounds left)` : ''}`, colour: '#e0574a' });

    const card = h('div.card' + (off ? '.disabled' : '') + (ed ? '.ed-' + tk.edition : ''), {
      'data-token': String(i),
      draggable: 'true',
      tip: {
        title: d.name, rarity: d.rarity, body: tokenText(tk, G), lines,
        foot: tk.dead ? 'Perished — no longer works'
          : off ? 'Disabled by The Grinder'
          : (G.canSellToken(i) ? `Sell $${tk.sellValue} · drag to reorder` : 'Eternal — cannot be sold')
      },
      ondragstart: (e) => { e.dataTransfer.setData('text/plain', String(i)); hideTip(); },
      ondragover: (e) => e.preventDefault(),
      ondrop: (e) => { e.preventDefault(); Sfx.chip(); G.moveToken(Number(e.dataTransfer.getData('text/plain')), i); },
      oncontextmenu: (e) => {
        e.preventDefault();
        if (G.tokens[i] !== tk || !G.canSellToken(i)) { Sfx.deny(); return; }
        if (confirm(`Sell ${d.name} for $${tk.sellValue}?`)) { Sfx.coin(); G.sellToken(i); }
      }
    },
      h('div.cname', null, d.name),
      h('div.cglyph', null, glyphFor(d)),
      h('div.ctag', null, RARITY[d.rarity].name),
      sk && h('div.sticker', null, sk.glyph));
    card.style.setProperty('--rarity', RARITY[d.rarity].colour);
    out.push(card);
  });

  for (let i = G.tokenCount(); i < G.maxTokens; i++) out.push(h('div.slot-empty'));
  return out;
}

const GLYPH_BY_RARITY = { common: '◆', uncommon: '❖', rare: '✦', legendary: '★' };

function omenCard(om, i) {
  const d = omenDef(om);
  const usable = G.omenUsable(i);
  return h('div.card.small.omen' + (usable ? '' : '.disabled'), {

    onclick: () => { if (usable) { Sfx.ui(); beginOmen(i); } else Sfx.deny(); },
    oncontextmenu: (e) => {

}

    }, h('div.stakedot'), h('div.picklbl', null, s.name.replace(' Stake', '')));
  }));

  const start = (seed) => bindGame(Game.newRun(seed, { wheelId: titleWheel, stakeId: titleStake }));

  return h('div.centered', null,
    h('h1.bigtitle', null, 'No Limit'),
    h('div.subtitle', null, 'a roulette roguelike'),

      h('button.btn.sm', { onclick: showProfile }, 'Records'),
      h('button.btn.sm', { onclick: showCollection }, `Collection ${Object.keys(Profile.seenTokens).length}/${TOKENS.length}`),

    h('div.hint', null, 'Click a spot to add a chip · right-click to take one back · Space to spin'));

function blindSelect() {

        ? 'No reward on this stake'
        : `Reward $${b.reward} + $1 per unused spin`),

        ? h('div.btnrow', null,
            h('button.btn.gold', { onclick: () => { resumeAudio(); if (isBoss) Sfx.boss(); else Sfx.ui(); G.startBlind(); } }, 'Play'),
            !isBoss && h('button.btn.sm', {
